<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Celulares - ML</title>
    
    <link rel="stylesheet" href="style.css">

    <style>
        body { background: transparent !important; padding: 20px; overflow-y: auto; }
        
        #main-content { max-width: 1300px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        
        .page-header { text-align: center; margin-bottom: 25px; }
        .page-title { color: var(--text-title); margin-bottom: 5px; font-weight: 900; text-transform: uppercase; font-size: 1.8rem; letter-spacing: 1px; }
        .page-subtitle { color: var(--text-muted); font-weight: 600; }

        .dashboard-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; align-items: start; }

        .form-container { background: var(--bg-card); padding: 25px; border-radius: 12px; box-shadow: var(--shadow-card); border: 1px solid var(--border-card); }
        .form-title { font-size: 1.1rem; color: var(--text-title); margin-bottom: 20px; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid var(--border-card); padding-bottom: 10px; }
        
        label { display: block; margin-top: 15px; font-weight: 800; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--border-card); border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; background: var(--bg-input); color: var(--text-main); outline: none; transition: 0.2s; font-weight: 600; }
        input:focus, select:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(52, 131, 250, 0.1); }
        input:disabled { background: var(--bg-body); cursor: not-allowed; opacity: 0.7; }
        
        .btn-salvar { width: 100%; padding: 14px; background-color: var(--accent-blue); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 900; margin-top: 25px; cursor: pointer; transition: 0.2s; }
        .btn-salvar:hover { background-color: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 131, 250, 0.3); }
        .btn-salvar.edit-mode { background-color: var(--accent-warn); color: #333; }
        
        .btn-cancelar { width: 100%; padding: 10px; background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-card); border-radius: 8px; font-size: 0.9rem; font-weight: bold; margin-top: 10px; cursor: pointer; transition: 0.2s; display: none; }
        .btn-cancelar:hover { background-color: var(--bg-body); color: var(--text-main); }

        .table-container { background: var(--bg-card); padding: 25px; border-radius: 12px; box-shadow: var(--shadow-card); border: 1px solid var(--border-card); overflow-x: auto; max-height: 700px; overflow-y: auto;}
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 4px; }
        
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th, .data-table td { padding: 12px 15px; border-bottom: 1px solid var(--border-card); font-size: 0.85rem; color: var(--text-main); }
        .data-table th { color: var(--text-muted); font-weight: 900; text-transform: uppercase; font-size: 0.75rem; position: sticky; top: -25px; background: var(--bg-card); z-index: 1; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; display: inline-block;}
        .badge-ativo { background: var(--accent-green); box-shadow: 0 0 8px rgba(0, 166, 80, 0.4); }
        .badge-bloqueado { background: var(--text-muted); box-shadow: 0 0 8px rgba(0, 0, 0, 0.2); }

        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; margin-right: 8px; transition: 0.2s; filter: grayscale(100%); opacity: 0.7;}
        .action-btn:hover { transform: scale(1.2); filter: grayscale(0%); opacity: 1;}

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="light">

    <div id="main-content">
        <div id="msg-unauth" style="display:none; text-align:center; padding: 50px;">
            <h2 style="color: var(--accent-red); margin-bottom: 10px;">Acesso Negado 🛑</h2>
            <p style="color: var(--text-main); font-weight: 600;">Esta página é restrita para uso de usuários autorizados.</p>
        </div>

        <div id="dashboard-content" style="display:none;">
            <div class="page-header">
                <h1 class="page-title">📱 Gestão de Aparelhos</h1>
                <p class="page-subtitle">Cadastre e monitore os equipamentos integrados à operação (Planilha).</p>
            </div>

            <div class="dashboard-grid">
                
                <div class="form-container">
                    <h2 class="form-title" id="form-header-text">➕ Registrar Aparelho</h2>
                    
                    <form id="formCadastro">
                        <label for="idCelular">ID do Celular (QR Code):</label>
                        <input type="text" id="idCelular" placeholder="Bipe ou digite o código aqui" required autofocus>

                        <label for="nomePessoa">Nome do Colaborador:</label>
                        <input type="text" id="nomePessoa" placeholder="Ex: João Silva" required>

                        <label for="turno">Turno da Operação:</label>
                        <select id="turno" required>
                            <option value="">Selecione o turno...</option>
                            <option value="AM0">AM0</option>
                            <option value="AM1">AM1</option>
                            <option value="PM">PM</option>
                            <option value="SD">SD</option>
                            <option value="Inventario">Inventário</option>
                        </select>

                        <label for="supervisor">Supervisor Responsável:</label>
                        <input type="text" id="supervisor" placeholder="Nome de quem liberou" required>

                        <button type="submit" class="btn-salvar" id="btn-submit">💾 Salvar Cadastro</button>
                        <button type="button" class="btn-cancelar" id="btn-cancelar" onclick="cancelarEdicao()">✖ Cancelar Edição</button>
                    </form>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID Aparelho</th>
                                <th>Colaborador</th>
                                <th>Turno</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-celulares">
                            <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando aparelhos da planilha...</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://reportes-bdb0a-default-rtdb.firebaseio.com/";
        const SCRIPT_URL = "SUA_URL_DO_APP_SCRIPT_AQUI"; // <--- COLOQUE A URL NOVA AQUI
        
        let currentUser = JSON.parse(localStorage.getItem('loggedUser')) || null;
        let celularesCadastrados = {};
        let modoEdicao = false; 

        function syncTheme() { 
            const theme = localStorage.getItem('themePreference') || 'light'; 
            document.body.setAttribute('data-theme', theme); 
        }
        syncTheme();
        window.addEventListener('message', (event) => { 
            if (event.data.type === 'THEME_CHANGED') { document.body.setAttribute('data-theme', event.data.theme); } 
        });

        window.onload = async () => {
            if (!currentUser || !currentUser.permissoes.includes('cadastro_celulares.html')) {
                document.getElementById('msg-unauth').style.display = 'block';
                return;
            }
            document.getElementById('dashboard-content').style.display = 'block';
            await carregarAparelhos();
        };

        // Função de comunicação com a Planilha (BLINDADA CONTRA CORS)
        async function fetchPlanilha(dados) {
            const res = await fetch('https://script.google.com/macros/s/AKfycbyPPMk7YsTy-28zsluiszAdklBeSGU-m5OOyXsXVlpr_VjZZdLMkK-7ql2edbGPtFUd/exec', {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8' // Passa pelos firewalls sem preflight
                },
                body: JSON.stringify(dados)
            });
            return await res.json();
        }

        async function registrarLogFirebase(acao) {
            try {
                const logData = { modulo: "Equipamentos", acao: acao, usuario: currentUser.usuario || 'Desconhecido', timestamp: Date.now() };
                await fetch(`${FIREBASE_URL}logs.json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(logData) });
            } catch(e) {}
        }

        async function carregarAparelhos() {
            const tbody = document.getElementById('tabela-celulares');
            try {
                const data = await fetchPlanilha({ action: "listarCelulares" });

                if (data.error) {
                    console.error("Erro da planilha:", data.error);
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--accent-red);">Erro do servidor: Verifique as colunas na Planilha.</td></tr>';
                    return;
                }

                if (!data || Object.keys(data).length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Nenhum aparelho registrado na planilha.</td></tr>';
                    celularesCadastrados = {};
                    return;
                }

                celularesCadastrados = data;
                tbody.innerHTML = '';

                let lista = Object.keys(data).map(key => ({ id_key: key, ...data[key] }));
                lista.sort((a, b) => (b.dataRegistro || 0) - (a.dataRegistro || 0));

                lista.forEach(cel => {
                    const isBloqueado = cel.status === 'bloqueado';
                    const badgeClass = isBloqueado ? 'badge-bloqueado' : 'badge-ativo';
                    const badgeText = isBloqueado ? 'Bloqueado' : 'Em Uso';
                    const iconBloqueio = isBloqueado ? '✅' : '🚫';
                    const titleBloqueio = isBloqueado ? 'Desbloquear Aparelho' : 'Bloquear Aparelho';

                    tbody.innerHTML += `
                        <tr style="${isBloqueado ? 'opacity: 0.6;' : ''}">
                            <td><strong>${cel.id_key}</strong></td>
                            <td>${cel.nome}</td>
                            <td>${cel.turno}</td>
                            <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                            <td>
                                <button class="action-btn" title="Editar" onclick="iniciarEdicao('${cel.id_key}')">✏️</button>
                                <button class="action-btn" title="${titleBloqueio}" onclick="alternarBloqueio('${cel.id_key}')">${iconBloqueio}</button>
                                <button class="action-btn" title="Excluir" onclick="excluirAparelho('${cel.id_key}')">🗑️</button>
                            </td>
                        </tr>
                    `;
                });

            } catch (e) {
                console.error("Erro no fetchPlanilha:", e);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--accent-red);">Erro ao comunicar com a planilha. Link correto?</td></tr>';
            }
        }

        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const btnSubmit = document.getElementById('btn-submit');
            const textoOriginal = btnSubmit.innerText;
            
            const idCelular = document.getElementById('idCelular').value.trim();
            const nomePessoa = document.getElementById('nomePessoa').value.trim();
            const turno = document.getElementById('turno').value;
            const supervisor = document.getElementById('supervisor').value.trim();

            btnSubmit.innerText = "⏳ Salvando..."; btnSubmit.disabled = true;

            try {
                let dadosAtuais = celularesCadastrados[idCelular] || {};
                
                const celularParaSalvar = {
                    id: idCelular,
                    nome: nomePessoa,
                    turno: turno,
                    supervisor: supervisor,
                    status: dadosAtuais.status || 'ativo', 
                    dataRegistro: dadosAtuais.dataRegistro || Date.now(), 
                    registradoPor: currentUser.usuario
                };

                await fetchPlanilha({
                    action: "salvarCelular",
                    celular: celularParaSalvar
                });

                if(modoEdicao) {
                    await registrarLogFirebase(`Editou o cadastro do aparelho <b>${idCelular}</b>.`);
                    alert('Cadastro atualizado com sucesso na Planilha!');
                } else {
                    await registrarLogFirebase(`Registrou a saída do aparelho <b>${idCelular}</b> para <b>${nomePessoa}</b>.`);
                    alert('Aparelho cadastrado com sucesso na Planilha!');
                }
                
                cancelarEdicao(); 
                await carregarAparelhos(); 

            } catch (error) {
                alert('Erro de conexão ao salvar na Planilha.');
            } finally {
                btnSubmit.innerText = textoOriginal;
                btnSubmit.disabled = false;
            }
        });

        window.iniciarEdicao = function(id) {
            const cel = celularesCadastrados[id];
            if(!cel) return;

            document.getElementById('idCelular').value = id;
            document.getElementById('idCelular').disabled = true; 
            
            document.getElementById('nomePessoa').value = cel.nome;
            document.getElementById('turno').value = cel.turno;
            document.getElementById('supervisor').value = cel.supervisor;

            modoEdicao = true;
            document.getElementById('form-header-text').innerHTML = "✏️ Editar Aparelho";
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = "💾 Atualizar Cadastro";
            btnSubmit.classList.add('edit-mode');
            
            document.getElementById('btn-cancelar').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelarEdicao = function() {
            document.getElementById('formCadastro').reset();
            document.getElementById('idCelular').disabled = false;
            
            modoEdicao = false;
            document.getElementById('form-header-text').innerHTML = "➕ Registrar Aparelho";
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = "💾 Salvar Cadastro";
            btnSubmit.classList.remove('edit-mode');
            
            document.getElementById('btn-cancelar').style.display = 'none';
            document.getElementById('idCelular').focus();
        };

        window.alternarBloqueio = async function(id) {
            const cel = celularesCadastrados[id];
            const novoStatus = cel.status === 'bloqueado' ? 'ativo' : 'bloqueado';
            const acaoTexto = novoStatus === 'bloqueado' ? 'Bloqueado' : 'Desbloqueado';
            
            if(!confirm(`Deseja mudar o status do aparelho ${id} para ${acaoTexto}?`)) return;

            try {
                const celularAtualizado = {
                    id: id,
                    nome: cel.nome,
                    turno: cel.turno,
                    supervisor: cel.supervisor,
                    status: novoStatus,
                    dataRegistro: cel.dataRegistro,
                    registradoPor: cel.registradoPor
                };

                await fetchPlanilha({ action: "salvarCelular", celular: celularAtualizado });
                await registrarLogFirebase(`Marcou o aparelho <b>${id}</b> como ${acaoTexto.toLowerCase()}.`);
                await carregarAparelhos();
            } catch(e) {
                alert("Erro ao alterar status na Planilha.");
            }
        };

        window.excluirAparelho = async function(id) {
            if(!confirm(`ATENÇÃO: Deseja apagar permanentemente o registro do aparelho ${id} da Planilha?`)) return;

            try {
                await fetchPlanilha({ action: "excluirCelular", id: id });
                await registrarLogFirebase(`Excluiu o registro do aparelho <b>${id}</b> do sistema.`);
                
                if (modoEdicao && document.getElementById('idCelular').value === id) {
                    cancelarEdicao();
                }
                await carregarAparelhos();
            } catch(e) {
                alert("Erro ao excluir o aparelho da Planilha.");
            }
        };
    </script>
</body>
</html>
