<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Portal de Reportes</title>

    <script>
        /* Home sempre roda dentro do index (shell com o menu global). */
        if (window === window.top) {
            window.location.replace('../index.html');
        }
    </script>

    <!-- Camada única de acesso a dados + controle de versão/cache global -->
    <script src="../js/portal-db.js"></script>
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            background: transparent !important;
            padding: 18px 15px 40px 15px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #home-view { width: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

        .muted-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); font-weight: 600; }
        .error-msg { text-align: center; padding: 40px 20px; color: #FF5252; font-weight: 600; }

        /* Aviso de manutenção (controlado no Admin) */
        #home-aviso { display: none; background: rgba(255, 176, 0, 0.12); border: 1px solid var(--accent-warn); color: var(--text-title); border-radius: 12px; padding: 12px 18px; font-weight: 700; font-size: 0.9rem; align-items: center; gap: 10px; }

        /* ============ HERO — BOAS-VINDAS ============ */
        .hero {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 45%, #3483fa 100%);
            border-radius: 20px; padding: 42px 34px;
            box-shadow: 0 16px 40px rgba(30, 60, 114, 0.30);
            text-align: center;
        }
        .hero::after {
            content: ''; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px;
            background: rgba(255, 255, 255, 0.08); border-radius: 50%;
        }
        .hero::before {
            content: ''; position: absolute; left: -60px; bottom: -100px; width: 220px; height: 220px;
            background: rgba(255, 241, 89, 0.10); border-radius: 50%;
        }
        .hero-icon {
            width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; backdrop-filter: blur(4px); position: relative; z-index: 1;
        }
        .hero h1 { color: #fff; font-size: 1.9rem; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.5px; text-transform: uppercase; position: relative; z-index: 1; }
        .hero-welcome { color: rgba(255, 255, 255, 0.92); font-size: 1.05rem; font-weight: 700; margin: 0 0 6px; position: relative; z-index: 1; }
        .hero-date { color: rgba(255, 255, 255, 0.70); font-size: 0.85rem; font-weight: 600; margin: 0; position: relative; z-index: 1; }
        .hero-divider { width: 64px; height: 4px; border-radius: 2px; background: #FFF159; margin: 18px auto 0; position: relative; z-index: 1; }

        /* ============ NOTÍCIAS ============ */
        .news-panel {
            background: var(--bg-card); border: 1px solid var(--border-card);
            border-radius: 18px; box-shadow: var(--shadow-card); overflow: hidden;
        }
        .news-header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
            padding: 18px 24px; border-bottom: 1px solid var(--border-card);
            background: rgba(52, 131, 250, 0.05);
        }
        .news-header h2 { font-size: 1.05rem; color: var(--text-title); display: flex; align-items: center; gap: 9px; margin: 0; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px; }
        .news-banner { font-size: 0.72rem; font-weight: 900; color: #2D3277; background: #FFF159; padding: 5px 12px; border-radius: 999px; letter-spacing: 0.5px; text-transform: uppercase; }

        .post-card { padding: 22px 24px; border-bottom: 1px solid var(--border-card); display: flex; flex-direction: column; gap: 12px; transition: background 0.2s; }
        .post-card:last-child { border-bottom: none; }
        .post-card:hover { background: rgba(52, 131, 250, 0.04); }
        .post-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .post-author-box { display: flex; align-items: center; gap: 10px; }
        .author-avatar { width: 40px; height: 40px; background: var(--bg-body); border: 1px solid var(--border-card); color: var(--text-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; overflow: hidden; flex: 0 0 auto; }
        .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .author-info { display: flex; flex-direction: column; }
        .author-name { font-weight: 900; color: var(--text-title); font-size: 0.95rem; }
        .post-date { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .post-tag { background: rgba(52, 131, 250, 0.15); color: var(--accent-blue); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; border: 1px solid rgba(52, 131, 250, 0.3); }

        .post-title { font-size: 1.15rem; font-weight: 900; color: var(--text-title); line-height: 1.3; }
        .post-body { font-size: 0.92rem; color: var(--text-main); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        .post-body img { max-width: 100%; border-radius: 10px; margin: 10px 0; }
        .post-body a { color: var(--accent-blue); font-weight: bold; text-decoration: underline; }

        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; padding-top: 14px; border-top: 1px solid var(--border-card); }
        .ml-signature { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; display: flex; align-items: center; gap: 6px; font-style: italic; }
        .ml-signature img { height: 14px; opacity: 0.7; }

        #btn-news-refresh { padding: 7px 14px; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; font-weight: 800; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer; transition: 0.2s; font-family: inherit; }
        #btn-news-refresh:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(52, 131, 250, 0.3); }
        #btn-news-refresh:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }

        /* ============ RESPONSIVIDADE ============ */
        @media (max-width: 768px) {
            body { padding: 10px 10px 30px; }
            .hero { padding: 30px 20px; border-radius: 16px; }
            .hero h1 { font-size: 1.35rem; }
            .hero-welcome { font-size: 0.95rem; }
            .news-header { padding: 14px 16px; }
            .post-card { padding: 16px; }
            .post-title { font-size: 1rem; }
            .post-body { font-size: 0.85rem; }
        }
    </style>
</head>
<body data-theme="light">

    <div id="home-view">

        <div id="home-aviso"></div>

        <!-- MENSAGEM CENTRAL DE BOAS-VINDAS -->
        <div class="hero">
            <div class="hero-icon">📊</div>
            <h1 id="home-titulo">Portal de Controles Internos</h1>
            <p class="hero-welcome" id="home-welcome">Bem-vindo(a) ao portal!</p>
            <p class="hero-date" id="home-date"></p>
            <div class="hero-divider"></div>
        </div>

        <!-- ÚLTIMAS NOTÍCIAS -->
        <div class="news-panel">
            <div class="news-header">
                <h2>📰 Últimas Notícias</h2>
                <span class="news-banner" id="home-banner" style="display:none;">📢 ÚLTIMAS NOVIDADES E ATUALIZAÇÕES LOGÍSTICAS</span>
                <button id="btn-news-refresh" onclick="carregarNoticias()" title="Atualizar notícias">🔄 Atualizar</button>
            </div>
            <div id="news-feed-container"><div class="muted-msg">Carregando mural...</div></div>
        </div>
    </div>

    <script>
        // ============================================================
        // HOME DO PORTAL — conteúdo padrão exibido ao entrar no site.
        // Roda dentro do iframe do index.html (shell com o menu global).
        // 100% planilha Google Sheets via PortalDB (nó portal_news).
        // Layout moderno: boas-vindas + últimas notícias.
        // ============================================================
        const URL_BD_HOME = window.PortalDB.baseAtiva();

        // Tema sincronizado com o shell (index.html)
        function syncTheme() {
            const theme = localStorage.getItem('themePreference') || 'light';
            document.body.setAttribute('data-theme', theme);
        }
        syncTheme();
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'THEME_CHANGED') {
                document.body.setAttribute('data-theme', event.data.theme);
            }
        });

        let CURRENT_LOGGED_USER = null;
        try { CURRENT_LOGGED_USER = JSON.parse(localStorage.getItem('loggedUser')); } catch(e) {}
        let currentUserStr = (CURRENT_LOGGED_USER && CURRENT_LOGGED_USER.usuario) ? CURRENT_LOGGED_USER.usuario : null;

        let globalNewsList = [];
        let userAvatarMap = {};

        // Configurações do portal (aba "_Config" da planilha central, via Admin)
        let homeConfig = {
            portal_titulo: 'Portal de Controles Internos',
            home_banner: '📢 ÚLTIMAS NOVIDADES E ATUALIZAÇÕES LOGÍSTICAS',
            home_intervalo_seg: 30,
            home_max_noticias: 0,
            notificacoes_ativas: true,
            manutencao_ativa: false,
            manutencao_msg: ''
        };

        // --- Variáveis para controle de Notificações ---
        let lastNewsTimestamp = localStorage.getItem('lastNewsTime') ? parseInt(localStorage.getItem('lastNewsTime')) : Date.now();
        let lastStatusTimestamp = localStorage.getItem('lastStatusTime') ? parseInt(localStorage.getItem('lastStatusTime')) : Date.now();

        function toBool(v, fallback) {
            if (v === undefined || v === null || v === '') return fallback;
            if (typeof v === 'boolean') return v;
            const s = String(v).trim().toLowerCase();
            if (['1','true','sim','on','ativo','yes'].indexOf(s) !== -1) return true;
            if (['0','false','nao','não','off','inativo','no'].indexOf(s) !== -1) return false;
            return fallback;
        }

        // Lê a aba _Config da planilha central (nó "config") e aplica na home
        async function carregarConfigPortal() {
            try {
                const res = await fetch(`${URL_BD_HOME}config.json`);
                const cfg = await res.json();
                if (cfg && typeof cfg === 'object') {
                    if (cfg.portal_titulo) homeConfig.portal_titulo = String(cfg.portal_titulo);
                    if (cfg.home_banner) homeConfig.home_banner = String(cfg.home_banner);
                    homeConfig.notificacoes_ativas = toBool(cfg.notificacoes_ativas, true);
                    homeConfig.manutencao_ativa    = toBool(cfg.manutencao_ativa,    false);
                    homeConfig.manutencao_msg      = cfg.manutencao_msg ? String(cfg.manutencao_msg) : '';
                    const seg = parseInt(cfg.home_intervalo_seg, 10);
                    if (!isNaN(seg) && seg >= 10) homeConfig.home_intervalo_seg = seg;
                    const maxN = parseInt(cfg.home_max_noticias, 10);
                    if (!isNaN(maxN) && maxN > 0) homeConfig.home_max_noticias = maxN;
                }
            } catch(e) { console.log('Aviso: configurações do portal não carregaram (usando padrão).'); }
            aplicarConfigPortal();
        }

        function aplicarConfigPortal() {
            const elTitulo = document.getElementById('home-titulo');
            if (elTitulo) elTitulo.innerText = homeConfig.portal_titulo;

            const elBanner = document.getElementById('home-banner');
            if (elBanner) {
                if (homeConfig.home_banner) {
                    elBanner.innerText = homeConfig.home_banner;
                    elBanner.style.display = 'inline-flex';
                } else {
                    elBanner.style.display = 'none';
                }
            }

            const aviso = document.getElementById('home-aviso');
            if (aviso) {
                if (homeConfig.manutencao_ativa) {
                    aviso.style.display = 'flex';
                    aviso.innerHTML = '⚠️ ' + (homeConfig.manutencao_msg || 'Portal em manutenção. Alguns reportes podem ficar indisponíveis.');
                } else {
                    aviso.style.display = 'none';
                }
            }
        }

        // Boas-vindas personalizada com a data de hoje
        function aplicarBoasVindas() {
            const elWelcome = document.getElementById('home-welcome');
            const elDate = document.getElementById('home-date');
            if (elWelcome) {
                elWelcome.innerText = currentUserStr
                    ? `Bem-vindo(a), ${currentUserStr}! 👋`
                    : 'Bem-vindo(a) ao portal! 👋';
            }
            if (elDate) {
                elDate.innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
            }
        }

        // Pede a permissão de notificação para o usuário
        function pedirPermissaoNotificacao() {
            if (!homeConfig.notificacoes_ativas) return;
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }
            }
        }

        // Escuta o mural (planilha) e avisa quando sai notícia/status novo
        async function checkNotifications() {
            if (!homeConfig.notificacoes_ativas) return;
            if (!("Notification" in window) || Notification.permission !== "granted") return;

            try {
                // Checa Notícias
                const resNews = await fetch(`${URL_BD_HOME}portal_news.json?_=${Date.now()}`);
                const newsData = await resNews.json();
                if(newsData) {
                    let latestTime = lastNewsTimestamp;
                    let newestNews = null;
                    Object.values(newsData).forEach(n => {
                        if(n.data > latestTime) {
                            latestTime = n.data;
                            newestNews = n;
                        }
                    });
                    if(newestNews) {
                        new Notification("📢 Nova Publicação no Portal!", {
                            body: newestNews.titulo,
                            icon: "https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png"
                        });
                        lastNewsTimestamp = latestTime;
                        localStorage.setItem('lastNewsTime', lastNewsTimestamp);
                    }
                }

                // Checa Status
                const resStatus = await fetch(`${URL_BD_HOME}portal_status.json?_=${Date.now()}`);
                const statusData = await resStatus.json();
                if(statusData) {
                    let latestStatusTime = lastStatusTimestamp;
                    let newestStatus = null;
                    Object.values(statusData).forEach(s => {
                        if(s.lastUpdate > latestStatusTime) {
                            latestStatusTime = s.lastUpdate;
                            newestStatus = s;
                        }
                    });
                    if (newestStatus) {
                        new Notification(`📊 Status Atualizado: ${newestStatus.nome}`, {
                            body: `Novo Estado: ${String(newestStatus.estado || '').toUpperCase()} - ${newestStatus.descricao}`,
                            icon: "https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png"
                        });
                        lastStatusTimestamp = latestStatusTime;
                        localStorage.setItem('lastStatusTime', lastStatusTimestamp);
                    }
                }
            } catch(e) { console.log("Aviso: Notificação não enviada.", e); }
        }

        // Recuperador universal de Avatares (autores das notícias)
        function getAvatarHTML(username) {
            let u = username ? username.toLowerCase() : '';
            let url = userAvatarMap[u];
            if (url) return `<img src="${url}">`;
            let inicial = u ? u.charAt(0).toUpperCase() : '👤';
            return `${inicial}`;
        }

        async function prepararMapaDeAvatares() {
            try {
                const res = await fetch(`${URL_BD_HOME}users.json?_=${Date.now()}`);
                const data = await res.json();
                if(data) {
                    Object.values(data).forEach(u => {
                        if(u.usuario) userAvatarMap[u.usuario.toLowerCase()] = u.avatar || null;
                    });
                }
            } catch(e) { console.log("Aviso: Mapa de avatares não carregou."); }
        }

        async function carregarNoticias() {
            const container = document.getElementById('news-feed-container');
            const btn = document.getElementById('btn-news-refresh');
            if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
            try {
                const res = await fetch(`${URL_BD_HOME}portal_news.json?_=${Date.now()}`);
                let data = await res.json();

                if(!data) {
                    container.innerHTML = '<div class="muted-msg">Ainda não há publicações no mural.</div>';
                    return;
                }

                if (Array.isArray(data)) { globalNewsList = data.map((v, i) => ({...v, key: i})).filter(v => v && v.id); }
                else { globalNewsList = Object.keys(data).map(k => ({...data[k], key: k})); }

                globalNewsList.sort((a,b) => b.data - a.data);

                renderNoticias();

            } catch (e) {
                if(container.innerHTML.includes('Carregando')) container.innerHTML = '<div class="error-msg">Falha ao obter mural de notícias.</div>';
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '🔄 Atualizar'; }
            }
        }

        function renderNoticias() {
            const container = document.getElementById('news-feed-container');
            container.innerHTML = '';

            let lista = globalNewsList;
            if(homeConfig.home_max_noticias > 0) lista = lista.slice(0, homeConfig.home_max_noticias);

            if(lista.length === 0) {
                container.innerHTML = '<div class="muted-msg">Nenhuma notícia publicada ainda.</div>';
                return;
            }

            lista.forEach(news => {
                const dataFormatada = new Date(news.data).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
                let authorName = news.autor || 'Admin';

                // RENDERIZAÇÃO DE MULTIPLAS TAGS
                let tagsHtml = '';
                if(news.tag) {
                    news.tag.split(',').forEach(t => {
                        if(t.trim()) tagsHtml += `<span class="post-tag">${t.trim()}</span>`;
                    });
                } else {
                    tagsHtml = `<span class="post-tag">Aviso</span>`;
                }

                container.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-author-box">
                                <div class="author-avatar">${getAvatarHTML(authorName)}</div>
                                <div class="author-info">
                                    <span class="author-name">${authorName}</span>
                                    <span class="post-date">${dataFormatada}</span>
                                </div>
                            </div>
                            <div style="display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end;">${tagsHtml}</div>
                        </div>

                        <div class="post-title">${news.titulo || ''}</div>
                        <div class="post-body">${news.corpo || ''}</div>

                        <div class="post-footer">
                            <div class="ml-signature">
                                <img src="https://upload.wikimedia.org/wikipedia/pt/0/04/Logotipo_MercadoLivre.png" alt="ML"> Equipe Inventário
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function atualizarTudo() {
            carregarNoticias().catch(function(){});
        }

        window.onload = async function() {
            try { await carregarConfigPortal(); } catch(e){ aplicarConfigPortal(); }
            aplicarBoasVindas();

            pedirPermissaoNotificacao();

            try { await prepararMapaDeAvatares(); } catch(e){ console.warn('avatar map falhou', e); }

            carregarNoticias().catch(function(e){ console.warn('noticias', e); });

            setInterval(() => {
                try { checkNotifications(); } catch(e){}
                atualizarTudo();
                if(window.PortalDB && window.PortalDB.checkAppVersionSilently){
                    window.PortalDB.checkAppVersionSilently();
                }
            }, homeConfig.home_intervalo_seg * 1000);
        };
    </script>
</body>
</html>
