<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Insumos - Mercado Livre</title>
    
    <!-- SISTEMA ANTI-ACESSO DIRETO -->
    <script>
        if (window === window.top) {
            const paginaAtual = window.location.pathname.split('/').pop() || 'insumos.html';
            window.location.replace('../index.html?page=pages/' + paginaAtual);
        }
    </script>

    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../style.css">

    <style>
        :root {
            --bg-header: rgba(15, 23, 42, 0.6);
            --bg-input: rgba(15, 23, 42, 0.8);
            --border-light: rgba(255, 255, 255, 0.2);
            --accent-warn: #FFB000;
        }
        [data-theme="light"] {
            --bg-header: rgba(255, 255, 255, 0.9);
            --bg-input: rgba(255, 255, 255, 0.9);
            --border-light: rgba(0, 0, 0, 0.1);
            --accent-warn: #B48B00;
        }

        html, body { width: 100%; min-height: 100%; background: transparent;}
        body { padding: 8px; }

        .top-header {
            background-color: #FFF159 !important; color: #2D3277; border-radius: 10px; padding: 10px 16px;
            display: grid; grid-template-columns: 170px 1fr auto; align-items: center; gap: 12px;
            margin-bottom: 10px; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header-left { display: flex; align-items: center; }
        .ml-logo { height: 28px; object-fit: contain; }

        .header-center { text-align: center; font-size: 0.95rem; font-weight: 900; color: #2D3277 !important; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

        .header-right .status-badge {
            background: #FFFFFF !important; color: #333333 !important; border: 1px solid rgba(0,0,0,0.1) !important;
            font-family: 'Inter', sans-serif; font-weight: 800; font-size: 0.8rem; padding: 6px 12px; border-radius: 6px; white-space: nowrap;
        }

        .btn-action { border-radius: 6px; padding: 6px 14px; font-size: .8rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: all 0.25s ease-in-out; white-space: nowrap; font-family: 'Inter', sans-serif; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-blue { background: var(--accent-blue); color: #fff; border: none; }
        .btn-blue:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-dark { background: rgba(255, 255, 255, 0.15); color: var(--text-main); border: 1px solid var(--border-card); }
        .btn-dark:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        [data-theme="light"] .btn-dark { background: rgba(0, 0, 0, 0.05); color: var(--text-main); border: 1px solid var(--border-light); }
        [data-theme="light"] .btn-dark:hover { background: rgba(0, 0, 0, 0.1); }

        .filter-card { background-color: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-card); }
        .filter-card label { color: var(--text-muted); font-size: .78rem; font-weight: 900; text-transform: uppercase; }
        .filter-card select { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-light); border-radius: 6px; padding: 7px 10px; outline: none; min-width: 260px; font-family: 'Inter', sans-serif; font-weight: 700; }
        .total-info { margin-left: auto; color: var(--text-title); font-size: .88rem; font-weight: 900; white-space: nowrap; }

        .table-wrapper { background-color: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 10px; overflow: auto; box-shadow: var(--shadow-card); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border-card); text-align: left; font-size: .88rem; color: var(--text-main); }
        th { background: var(--bg-header); color: var(--text-title); text-transform: uppercase; font-size: .74rem; font-weight: 900; position: sticky; top: 0; }
        tr { transition: background-color 0.2s; }
        tr:hover td { background-color: rgba(255,255,255,0.08); }
        [data-theme="light"] tr:hover td { background-color: rgba(0,0,0,0.04); }

        .center { text-align: center; }
        .muted { color: var(--text-muted); text-align: center; padding: 28px !important; font-weight: 900; }
        .col-name { font-weight: 700; }
        .col-date { color: var(--text-muted); font-size: 0.8rem; font-weight: 600; }
        .col-estoque { font-weight: 900; }

        .stock-ok { color: var(--accent-green); }
        .stock-warn { color: var(--accent-warn); }
        .stock-bad { color: var(--accent-red); }

        .dot { display: inline-block; width: 13px; height: 13px; border-radius: 50%; }
        .dot-ok { background: var(--accent-green); box-shadow: 0 0 10px rgba(0,166,80,.75); }
        .dot-warn { background: var(--accent-warn); box-shadow: 0 0 10px rgba(255,176,0,.75); }
        .dot-bad { background: var(--accent-red); box-shadow: 0 0 10px rgba(255,82,82,.75); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-header); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 900px) {
            .top-header { grid-template-columns: 1fr; text-align: center; gap: 8px; }
            .header-left, .header-right { justify-content: center; }
            .header-center { white-space: normal; font-size: .95rem; }
            .header-right { flex-wrap: wrap; }
            .filter-card { flex-direction: column; align-items: stretch; }
            .filter-card select { width: 100%; min-width: unset; }
            .total-info { margin-left: 0; text-align: right; }
        }
    </style>
    <script src="../js/portal-db.js"></script>
</head>

<body data-theme="light">
    <div class="top-header">
        <div class="header-left">
            <img src="https://upload.wikimedia.org/wikipedia/pt/0/04/Logotipo_MercadoLivre.png" class="ml-logo" alt="Mercado Livre">
        </div>

        <div class="header-center" id="main-title">Estoque de Insumos Operacional Crítico</div>

        <div class="header-right">
            <span class="status-badge" id="data-status">Conectando ao banco...</span>
            <button class="btn-action btn-dark" onclick="baixarDashboardComoImagem()" title="Exportar Tabela em Imagem UHD 4K">Exportar 4K</button>
            <a href="contagem_insumos.html" class="btn-action btn-blue">Contagem</a>
            <button class="btn-action btn-dark" onclick="carregarDoBanco()">Atualizar</button>
        </div>
    </div>

    <div class="filter-card">
        <label for="filter-categoria">Categoria:</label>
        <select id="filter-categoria"><option value="Todos">Todos</option></select>
        <span class="total-info" id="total-info">0 itens</span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width:40%;">Nome do Material</th>
                    <th class="center" style="width:15%;">Última Atualização</th>
                    <th class="center" style="width:15%;">Estoque Segurança</th>
                    <th class="center" style="width:15%;">Estoque Atual</th>
                    <th class="center" style="width:15%;">Status</th>
                </tr>
            </thead>
            <tbody id="tbody-insumos">
                <tr><td class="muted" colspan="5">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const FIREBASE_URL = PortalDB.baseAtiva(); // 100% planilha Google Sheets
        const FIREBASE_NODE = "insumos";
        const $ = (s) => document.querySelector(s);
        let ALL_ITEMS = [];

        // ============ SINCRONIZAÇÃO DE TEMA (VEM DO PAI) ============
        function syncTheme() {
            const theme = localStorage.getItem('themePreference') || 'light';
            document.body.setAttribute('data-theme', theme);
        }
        syncTheme();
        window.addEventListener('storage', (e) => { if (e.key === 'themePreference') syncTheme(); });

        function obterDataHojeFormatada() { const hoje = new Date(); const dia = String(hoje.getDate()).padStart(2, '0'); const mes = String(hoje.getMonth() + 1).padStart(2, '0'); const ano = hoje.getFullYear(); return `${dia}/${mes}/${ano}`; }
        function extrairApenasData(dataCompleta) { if (!dataCompleta) return '-'; return dataCompleta.split(' ')[0].replace(',', ''); }
        function setStatus(texto, cor = "#FF7733") { const el = $('#data-status'); el.innerText = texto; el.style.color = cor; }
        function escapeHtml(value) { return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
        function escapeAttr(value) { return escapeHtml(value); }
        function toNumber(value) { if (value === null || value === undefined || value === '') return 0; let s = String(value).trim(); if (!s) return 0; s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return Number.isFinite(n) ? n : 0; }

        function getValue(item, keys, fallback = '') {
            if (!item) return fallback; 
            for (const key of keys) { if (item[key] !== undefined && item[key] !== null && String(item[key]).trim() !== '') return item[key]; }
            const lowerMap = {}; Object.keys(item || {}).forEach(k => { lowerMap[k.trim().toLowerCase()] = k; });
            for (const key of keys) { const found = lowerMap[String(key).trim().toLowerCase()]; if (found && item[found] !== undefined && item[found] !== null && String(item[found]).trim() !== '') return item[found]; }
            return fallback;
        }

        function normalizeItem(row, index) {
            return {
                id_material: String(getValue(row, ['id_material', 'ID Material', 'Id Material', 'id'], index + 1)).trim(),
                nome_material: String(getValue(row, ['nome_material', 'Nome do Material', 'nome', 'Material'], '')).trim(),
                categoria_material: String(getValue(row, ['categoria_material', 'Categoria', 'categoria'], 'Sem categoria')).trim() || 'Sem categoria',
                estoque_segurança: getValue(row, ['estoque_segurança', 'Estoque Segurança', 'Estoque Seguranca', 'segurança', 'seguranca'], 0),
                Estoque_atual: getValue(row, ['Estoque_atual', 'estoque_atual', 'Estoque Atual'], 0),
                "Ultima contagem": String(getValue(row, ['Ultima contagem', 'Última contagem', 'ultima_contagem'], '')).trim()
            };
        }

        function semaforoClass(atual, seguranca) {
            atual = toNumber(atual); seguranca = toNumber(seguranca);
            if (seguranca <= 0) return atual > 0 ? 'ok' : 'bad';
            if (atual <= 0) return 'bad';
            if (atual < seguranca) return 'bad';
            if (atual <= seguranca * 1.2) return 'warn';
            return 'ok';
        }

        function formatNumberLikeOriginal(value) { if (value === null || value === undefined || value === '') return '0'; const s = String(value).trim(); if (!s) return '0'; return s; }

        function fillCategorias(items) {
            const valorAtual = $('#filter-categoria').value || 'Todos';
            const cats = [...new Set(items.map(i => i.categoria_material || 'Sem categoria'))].map(c => String(c).trim()).filter(Boolean).sort((a,b) => a.localeCompare(b));
            const sel = $('#filter-categoria');
            sel.innerHTML = `<option value="Todos">Todos</option>` + cats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
            if ([...sel.options].some(opt => opt.value === valorAtual)) sel.value = valorAtual;
        }

        function renderTabela(items) {
            const catSel = $('#filter-categoria').value;
            const filtered = items.filter(it => { return catSel === 'Todos' || String(it.categoria_material).trim() === catSel; });
            $('#total-info').innerText = `${items.length} itens`;

            if (filtered.length === 0) { $('#tbody-insumos').innerHTML = `<tr><td class="muted" colspan="5">Nenhum item para este filtro.</td></tr>`; return; }

            const priority = { bad: 0, warn: 1, ok: 2 };
            const sorted = [...filtered].sort((a,b) => {
                const sa = semaforoClass(a.Estoque_atual, a.estoque_segurança); const sb = semaforoClass(b.Estoque_atual, b.estoque_segurança);
                if (priority[sa] !== priority[sb]) return priority[sa] - priority[sb];
                return String(a.nome_material).localeCompare(String(b.nome_material));
            });

            let html = '';
            for (const it of sorted) {
                const s = semaforoClass(it.Estoque_atual, it.estoque_segurança);
                const stockCls = s === 'ok' ? 'stock-ok' : s === 'warn' ? 'stock-warn' : 'stock-bad';
                const dotCls = s === 'ok' ? 'dot-ok' : s === 'warn' ? 'dot-warn' : 'dot-bad';
                const dataAtualizacao = extrairApenasData(it["Ultima contagem"]);

                html += `
                    <tr>
                        <td class="col-name">${escapeHtml(it.nome_material)}</td>
                        <td class="center col-date">${escapeHtml(dataAtualizacao)}</td>
                        <td class="center">${escapeHtml(formatNumberLikeOriginal(it.estoque_segurança))}</td>
                        <td class="center col-estoque ${stockCls}">${escapeHtml(formatNumberLikeOriginal(it.Estoque_atual))}</td>
                        <td class="center"><span class="dot ${dotCls}"></span></td>
                    </tr>
                `;
            }
            $('#tbody-insumos').innerHTML = html;
        }

        async function carregarDoBanco() {
            setStatus('Conectando ao banco...', '#3483FA');
            try {
                const response = await fetch(`${FIREBASE_URL}${FIREBASE_NODE}.json`);
                const dbData = await response.json();
                if (dbData && dbData.lista) {
                    ALL_ITEMS = [];
                    if (Array.isArray(dbData.lista)) { dbData.lista.forEach((row, index) => { if (row !== null && row !== undefined) ALL_ITEMS.push(normalizeItem(row, index)); }); } 
                    else { Object.keys(dbData.lista).forEach((key, index) => { const row = dbData.lista[key]; if (row !== null && row !== undefined) ALL_ITEMS.push(normalizeItem(row, index)); }); }
                    ALL_ITEMS = ALL_ITEMS.filter(x => String(x.nome_material).trim() !== '');
                    fillCategorias(ALL_ITEMS); renderTabela(ALL_ITEMS);
                    const dataDb = extrairApenasData(dbData.atualizadoEm) || 'Desconhecida'; setStatus(`Atualizado: ${dataDb}`, '#00A650');
                } else {
                    ALL_ITEMS = []; fillCategorias(ALL_ITEMS); renderTabela(ALL_ITEMS);
                    $('#tbody-insumos').innerHTML = `<tr><td class="muted" colspan="5">Banco vazio. Atualize os itens pela página Contagem de Insumos.</td></tr>`;
                    setStatus('Banco vazio.', '#FF7733');
                }
            } catch (error) { $('#tbody-insumos').innerHTML = `<tr><td class="muted" colspan="5">Não foi possível conectar ao banco de dados.</td></tr>`; setStatus('Erro ao conectar.', '#FF5252'); }
        }

        function baixarDashboardComoImagem() {
            if (!ALL_ITEMS || ALL_ITEMS.length === 0) return alert("Nenhum dado ativo para exportar.");
            const statusBadge = document.getElementById('data-status'); const txtOriginal = statusBadge.innerText; const corOriginal = statusBadge.style.color;
            statusBadge.innerText = 'Processando UHD 4K...'; statusBadge.style.color = '#3483FA';

            const overrideStyle = document.createElement('style'); overrideStyle.id = 'temp-capture-rules';
            overrideStyle.innerHTML = `.btn-action, .filter-card { display: none !important; } ::-webkit-scrollbar { display: none !important; } body, html { overflow: visible !important; height: auto !important; } .table-wrapper { overflow: visible !important; border: none !important; box-shadow: none !important;}`;
            document.head.appendChild(overrideStyle);

            setTimeout(() => {
                html2canvas(document.body, { scale: 3, useCORS: true, allowTaint: true, backgroundColor: document.body.getAttribute('data-theme') === 'light' ? '#ffffff' : '#0b121f', logging: false }).then(canvas => {
                    if (document.getElementById('temp-capture-rules')) document.head.removeChild(overrideStyle);
                    statusBadge.innerText = txtOriginal; statusBadge.style.color = corOriginal;
                    const hoje = new Date(); const dataFormatada = `${String(hoje.getDate()).padStart(2, '0')}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${hoje.getFullYear()}`;
                    const link = document.createElement('a'); link.download = `Estoque_Insumos_${dataFormatada}_4K.png`; link.href = canvas.toDataURL('image/png'); link.click();
                }).catch(err => { if (document.getElementById('temp-capture-rules')) document.head.removeChild(overrideStyle); statusBadge.innerText = 'Erro na captura'; statusBadge.style.color = '#FF5252'; });
            }, 300);
        }

        $('#filter-categoria').addEventListener('change', () => { renderTabela(ALL_ITEMS); });
        document.getElementById('main-title').innerText = `Estoque de Insumos Operacional Crítico - ${obterDataHojeFormatada()}`;
        carregarDoBanco();
    </script>
</body>
</html>
