<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Biblioteca BigQuery</title>
    
    <link rel="stylesheet" href="style.css">

    <style>
        body { background: transparent !important; padding: 20px; overflow-y: auto; }
        #main-content { max-width: 1000px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        
        .bq-card { background: var(--bg-card); border: 1px solid var(--border-card); padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow-card); transition: 0.2s; cursor: pointer; border-left: 4px solid #1e1e1e; }
        .bq-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-left-color: var(--accent-blue); }

        .bq-tags-container { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .bq-cat-badge { background: #2d2d2d; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
        .bq-tag-badge { background: rgba(52,131,250,0.1); color: var(--accent-blue); border: 1px solid rgba(52,131,250,0.3); padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 800; }

        .bq-title { font-size: 1.2rem; font-weight: 900; color: var(--text-title); margin-bottom: 5px; }
        .bq-desc { font-size: 0.9rem; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Estilo Interno do Modal de Visualização da Query */
        .bq-modal-content { font-size: 0.95rem; color: var(--text-main); line-height: 1.6; padding-bottom: 20px;}
        .bq-modal-content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        .bq-modal-content a { color: var(--accent-blue); font-weight: bold; }
        
        .modal-large { max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 35px; }
    </style>
</head>
<body data-theme="light">

    <div id="main-content">
        <h1 style="text-align: center; color: var(--text-title); margin-bottom: 5px; font-weight: 900; text-transform: uppercase; font-size: 1.8rem;">Biblioteca BigQuery</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-weight: 600;">Encontre, entenda e copie queries prontas em 1 clique.</p>

        <div class="search-bar-container">
            <input type="text" id="search-bq" class="search-input" placeholder="Pesquisar por nome da query, tag, categoria ou algo da descrição..." onkeyup="filtrarBQ()">
        </div>

        <div id="bq-list-container">
            <div style="text-align:center; padding:40px; color:var(--text-muted); font-weight:bold;">Carregando scripts da biblioteca...</div>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO DA QUERY -->
    <div class="auth-modal" id="bqViewModal">
        <div class="auth-box modal-large" id="bq-modal-box">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border-card); padding-bottom: 15px; margin-bottom: 20px;">
                <div style="flex:1;">
                    <div id="modal-bq-tags" class="bq-tags-container"></div>
                    <h2 id="modal-bq-title" style="margin: 0; color: var(--text-title); font-size: 1.5rem;">Título</h2>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;" id="modal-bq-meta"></div>
                </div>
                <button onclick="fecharModalBQ()" style="background:transparent; border:none; color:var(--text-muted); font-size:2rem; cursor:pointer; margin-left: 15px; line-height: 1;">&times;</button>
            </div>
            
            <div id="modal-bq-post" class="bq-modal-content"></div>

            <div class="code-container">
                <div class="code-header">
                    <span>SQL Query</span>
                    <button class="btn-copy" onclick="copiarCodigoSql(this)" id="btn-copy-action">📋 Copiar Código</button>
                </div>
                <div class="code-content" id="modal-bq-sql"></div>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://reportes-bdb0a-default-rtdb.firebaseio.com/";
        let globalBqList = [];

        // Sincroniza o tema com a página pai (index.html)
        function syncTheme() { 
            const theme = localStorage.getItem('themePreference') || 'light'; 
            document.body.setAttribute('data-theme', theme); 
        }
        syncTheme();
        window.addEventListener('message', (event) => { 
            if (event.data.type === 'THEME_CHANGED') document.body.setAttribute('data-theme', event.data.theme); 
        });

        window.onload = async () => {
            await carregarDadosBQ();
            
            // Fechar modal ao clicar fora
            document.getElementById('bqViewModal').addEventListener('click', function(e) { 
                if(e.target === this) fecharModalBQ(); 
            });
        };

        async function carregarDadosBQ() {
            const container = document.getElementById('bq-list-container');
            try {
                const res = await fetch(`${FIREBASE_URL}portal_bigquery.json?_=${Date.now()}`);
                const data = await res.json();
                
                if(!data) {
                    container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted); font-weight:bold;">A biblioteca ainda está vazia. Adicione queries pelo Painel Admin.</div>';
                    return;
                }

                if (Array.isArray(data)) { globalBqList = data.filter(Boolean); } 
                else { globalBqList = Object.keys(data).map(k => data[k]); }
                
                // Ordena pelas mais recentes
                globalBqList.sort((a,b) => b.data - a.data);
                
                renderizarBQ(globalBqList);
            } catch(e) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#FF5252; font-weight:bold;">Erro ao conectar com o banco de dados.</div>';
            }
        }

        function renderizarBQ(lista) {
            const container = document.getElementById('bq-list-container');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted); font-weight:bold;">Nenhum script encontrado para essa pesquisa.</div>';
                return;
            }

            lista.forEach((bq, index) => {
                let tagsHtml = `<span class="bq-cat-badge">📁 ${bq.categoria || 'Geral'}</span>`;
                if(bq.tags) {
                    bq.tags.split(',').forEach(t => {
                        if(t.trim()) tagsHtml += `<span class="bq-tag-badge">${t.trim()}</span>`;
                    });
                }

                container.innerHTML += `
                    <div class="bq-card" onclick="abrirModalBQ(${index})">
                        <div class="bq-tags-container">${tagsHtml}</div>
                        <div class="bq-title">${bq.titulo}</div>
                        <div class="bq-desc">${bq.descricao || 'Sem descrição.'}</div>
                    </div>
                `;
            });
        }

        function filtrarBQ() {
            const termo = document.getElementById('search-bq').value.toLowerCase();
            const filtradas = globalBqList.filter(bq => {
                const t = bq.titulo ? bq.titulo.toLowerCase() : '';
                const c = bq.categoria ? bq.categoria.toLowerCase() : '';
                const tg = bq.tags ? bq.tags.toLowerCase() : '';
                const d = bq.descricao ? bq.descricao.toLowerCase() : '';
                
                return t.includes(termo) || c.includes(termo) || tg.includes(termo) || d.includes(termo);
            });
            renderizarBQ(filtradas);
        }

        let codigoAtualParaCopiar = "";

        // O índice (idx) que passamos aqui é baseado na lista global atual que foi filtrada
        window.abrirModalBQ = function(idx) {
            // Como a lista na tela pode estar filtrada, precisamos buscar o item exato renderizado
            // O idx passado no clique refere-se ao array atual filtrado.
            // Para ser exato e seguro independente do filtro, melhor passar o index original.
            // Para não complicar a filtragem, a abordagem abaixo recria a array filtrada para achar o item:
            
            const termo = document.getElementById('search-bq').value.toLowerCase();
            let listaAtiva = globalBqList;
            if (termo) {
                listaAtiva = globalBqList.filter(bq => 
                    (bq.titulo || '').toLowerCase().includes(termo) || 
                    (bq.categoria || '').toLowerCase().includes(termo) || 
                    (bq.tags || '').toLowerCase().includes(termo) || 
                    (bq.descricao || '').toLowerCase().includes(termo)
                );
            }
            
            const bq = listaAtiva[idx];
            if (!bq) return;

            let tagsHtml = `<span class="bq-cat-badge" style="font-size: 0.8rem;">📁 ${bq.categoria || 'Geral'}</span>`;
            if(bq.tags) {
                bq.tags.split(',').forEach(t => {
                    if(t.trim()) tagsHtml += `<span class="bq-tag-badge" style="font-size: 0.8rem;">${t.trim()}</span>`;
                });
            }
            
            let dataStr = new Date(bq.data).toLocaleDateString('pt-BR');

            document.getElementById('modal-bq-tags').innerHTML = tagsHtml;
            document.getElementById('modal-bq-title').innerText = bq.titulo;
            document.getElementById('modal-bq-meta').innerHTML = `Publicado por <b>${bq.autor}</b> em ${dataStr}`;
            
            document.getElementById('modal-bq-post').innerHTML = bq.corpo_post || '';
            document.getElementById('modal-bq-sql').innerText = bq.codigo_sql || '';
            
            // Guarda o código na variável global para o botão conseguir copiar
            codigoAtualParaCopiar = bq.codigo_sql || '';

            document.getElementById('bqViewModal').classList.add('active');
            
            // Reseta o texto do botão de cópia
            document.getElementById('btn-copy-action').innerHTML = "📋 Copiar Código";
        }

        window.fecharModalBQ = function() {
            document.getElementById('bqViewModal').classList.remove('active');
        }

        window.copiarCodigoSql = function(btn) {
            if (!codigoAtualParaCopiar) return;
            
            navigator.clipboard.writeText(codigoAtualParaCopiar).then(() => {
                btn.innerHTML = "✅ Código Copiado!";
                btn.style.background = "var(--accent-green)";
                btn.style.borderColor = "var(--accent-green)";
                
                setTimeout(() => {
                    btn.innerHTML = "📋 Copiar Código";
                    btn.style.background = "rgba(255,255,255,0.1)";
                    btn.style.borderColor = "rgba(255,255,255,0.2)";
                }, 2500);
            }).catch(err => {
                alert("Falha ao copiar texto. Selecione e copie manualmente.");
            });
        }
    </script>
</body>
</html>
