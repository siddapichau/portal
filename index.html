<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Reportes - Mercado Livre</title>
    
    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png" type="image/png">
    <link rel="stylesheet" href="style.css">

    <style>
        :root { --bg-gradient: radial-gradient(circle at top right, #1e3c72 0%, #0f172a 40%, #050505 100%); }
        [data-theme="light"] { --bg-gradient: #ffffff; }
        
        body { background: var(--bg-gradient); background-attachment: fixed; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-y: hidden; }
        
        /* MUDANÇA AQUI: max-width alterado para 100% para usar toda a lateral da tela */
        #main-content { margin-top: 80px; width: 100%; max-width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 15px; flex: 1; transition: 0.3s; }

        .main-title { font-size: 2.2rem; font-weight: 900; color: var(--text-title); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; position: relative; padding-bottom: 12px; text-align: center; }
        .main-title::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 70px; height: 4px; background-color: var(--accent-blue); border-radius: 2px; }

        .quote-container { background: var(--bg-card); border-left: 4px solid var(--accent-blue); border-radius: 8px; padding: 15px 25px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); max-width: 700px; width: 100%; margin-bottom: 30px; position: relative; overflow: hidden; text-align: center; }
        .quote-text { font-size: 1rem; color: var(--text-main); font-style: italic; font-weight: 600; transition: opacity 0.5s ease; }
        .progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent-blue); width: 0%; }

        .feed-box {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 0;
            max-width: 700px;
            width: 100%;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        
        .feed-header {
            background: rgba(52, 131, 250, 0.05);
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-card);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .feed-header h2 { font-size: 1.15rem; color: var(--text-title); display: flex; align-items: center; gap: 10px; margin: 0; }
        
        .live-indicator {
            width: 8px; height: 8px; background-color: var(--accent-green);
            border-radius: 50%; box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }

        .feed-refresh { background: transparent; border: none; color: var(--accent-blue); font-size: 0.85rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .feed-refresh:hover { opacity: 0.7; }
        
        .feed-list { list-style: none; padding: 0; margin: 0; max-height: 450px; overflow-y: auto; }
        .feed-item {
            padding: 18px 25px; border-bottom: 1px solid var(--border-card);
            display: grid; grid-template-columns: 42px 1fr; gap: 15px; align-items: start; transition: background 0.2s;
        }
        .feed-item:hover { background: rgba(0,0,0,0.02); }
        [data-theme="dark"] .feed-item:hover { background: rgba(255,255,255,0.02); }
        .feed-item:last-child { border-bottom: none; }
        
        .feed-icon {
            width: 42px; height: 42px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
        }
        .feed-content { display: flex; flex-direction: column; gap: 4px; margin-top: -2px;}
        .feed-module { font-size: 0.75rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .feed-action { font-size: 0.95rem; color: var(--text-main); font-weight: 600; line-height: 1.4;}
        .feed-meta { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 5px; margin-top: 2px;}
        .feed-meta strong { color: var(--text-title); font-weight: 800; }

        /* MUDANÇA AQUI: Altura do iframe ajustada para refletir a nova margem */
        #app-frame { display: none; width: 100%; height: calc(100vh - 90px); border: none; border-radius: 12px; background: var(--bg-body); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body data-theme="light">

    <script src="menu.js"></script>

    <div id="main-content">
        <h1 class="main-title" id="page-title">Portal de Controles Internos</h1>

        <div class="quote-container" id="quote-box">
            <span id="animated-quote" class="quote-text">"Carregando a missão do dia..."</span>
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="feed-box" id="home-view">
            <div class="feed-header">
                <h2><div class="live-indicator" title="Monitorando ao vivo"></div> Últimas Atualizações</h2>
                <button class="feed-refresh" id="btn-refresh" onclick="carregarFeedAtualizacoes(false)">🔄 Atualizar</button>
            </div>
            <ul class="feed-list" id="feed-list">
                <div style="text-align:center; padding: 40px 20px; color: var(--text-muted);">Conectando ao banco de dados...</div>
            </ul>
        </div>

        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        const messages = [ "O talento vence jogos, mas o trabalho em equipe e a inteligência vencem campeonatos.", "Um inventário preciso é o coração da nossa logística.", "No Mercado Livre, não entregamos apenas pacotes, entregamos propósitos.", "Nossa força está na união. Juntos, fazemos do nosso inventário um modelo de eficiência." ];
        let msgIndex = 0; const quoteEl = document.getElementById('animated-quote'); const progressBar = document.getElementById('progress-bar'); const INTERVAL_MS = 10000;

        function startMessageCycle() {
            if(!quoteEl) return; quoteEl.innerText = messages[msgIndex]; animateProgressBar();
            setInterval(() => { quoteEl.style.opacity = 0; setTimeout(() => { msgIndex = (msgIndex + 1) % messages.length; quoteEl.innerText = messages[msgIndex]; quoteEl.style.opacity = 1; animateProgressBar(); }, 500); }, INTERVAL_MS);
        }

        function animateProgressBar() {
            progressBar.style.transition = 'none'; progressBar.style.width = '0%'; void progressBar.offsetWidth; 
            progressBar.style.transition = `width ${INTERVAL_MS}ms linear`; progressBar.style.width = '100%';
        }
        
        async function carregarFeedAtualizacoes(isAuto = false) {
            const listEl = document.getElementById('feed-list'); const refreshBtn = document.getElementById('btn-refresh');
            if (!isAuto) refreshBtn.innerHTML = '⏳ Sincronizando...';

            try {
                const fb_url = "https://reportes-bdb0a-default-rtdb.firebaseio.com/"; const res = await fetch(`${fb_url}logs.json`); const data = await res.json();
                if(!data) { listEl.innerHTML = '<div style="text-align:center; padding: 40px 20px; color: var(--text-muted);">Nenhuma atividade registrada ainda.</div>'; if (!isAuto) refreshBtn.innerHTML = '🔄 Atualizar'; return; }
                let logs = Object.keys(data).map(key => data[key]); logs.sort((a, b) => b.timestamp - a.timestamp); logs = logs.slice(0, 15); listEl.innerHTML = '';
                
                logs.forEach(log => {
                    const dataFormatada = new Date(log.timestamp).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                    let icon = '📝'; let bgStyle = 'rgba(52, 131, 250, 0.1)'; let colorStyle = 'var(--accent-blue)';
                    const actionTxt = log.acao.toLowerCase();
                    if (actionTxt.includes('adicionou')) { icon = '✨'; bgStyle = 'rgba(0, 166, 80, 0.1)'; colorStyle = 'var(--accent-green)'; } 
                    else if (actionTxt.includes('removeu') || actionTxt.includes('excluiu')) { icon = '🗑️'; bgStyle = 'rgba(255, 82, 82, 0.1)'; colorStyle = 'var(--accent-red)'; }

                    listEl.innerHTML += `
                        <li class="feed-item">
                            <div class="feed-icon" style="background: ${bgStyle}; color: ${colorStyle};">${icon}</div>
                            <div class="feed-content">
                                <span class="feed-module">${log.modulo}</span>
                                <span class="feed-action">${log.acao}</span>
                                <span class="feed-meta">Feito por <strong>${log.usuario}</strong> • ${dataFormatada}</span>
                            </div>
                        </li>
                    `;
                });
            } catch (e) { if (!isAuto) listEl.innerHTML = '<div style="text-align:center; padding: 40px 20px; color: #FF5252;">Erro ao carregar o feed de dados.</div>'; } 
            finally { if (!isAuto) refreshBtn.innerHTML = '🔄 Atualizar'; }
        }

        setTimeout(() => { startMessageCycle(); carregarFeedAtualizacoes(false); setInterval(() => { carregarFeedAtualizacoes(true); }, 30000); }, 500);
    </script>
</body>
</html>
