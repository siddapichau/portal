<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Portal de Reportes - Mercado Livre</title>

    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png" type="image/png">

    <!-- ===== CSS GLOBAL DO PORTAL ===== -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================================
           INDEX = SHELL (casca) DO PORTAL
           ---------------------------------------------------------
           O index NÃO tem conteúdo próprio. Ele carrega apenas:
             1) o CSS global
             2) os .js do sistema (portal-db.js + menu.js + helpers)
             3) o iframe #app-frame onde TODAS as páginas abrem
           A página inicial padrão é pages/home.html (PAGINA_INICIAL).
           ========================================================= */
        :root { --bg-gradient: radial-gradient(circle at top right, #1e3c72 0%, #0f172a 40%, #050505 100%); }
        [data-theme="light"] { --bg-gradient: #ffffff; }

        body { background: var(--bg-gradient); background-attachment: fixed; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-y: hidden; }

        #main-content { margin-top: 70px; width: 100%; max-width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0; flex: 1; transition: 0.3s; }

        #app-frame { display: block; width: 100%; height: calc(100vh - 70px); border: none; background: transparent; }

        /* Tela de carregamento do shell (aparece só até a home responder) */
        #shell-loader {
            position: fixed; inset: 70px 0 0 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; z-index: 5;
            background: var(--bg-gradient); transition: opacity .35s ease;
        }
        #shell-loader.hidden { opacity: 0; pointer-events: none; }
        .shell-spinner {
            width: 42px; height: 42px; border-radius: 50%;
            border: 4px solid rgba(52,131,250,.2); border-top-color: var(--accent-blue);
            animation: shellSpin .8s linear infinite;
        }
        @keyframes shellSpin { to { transform: rotate(360deg); } }
        .shell-loader-txt { font-size: .85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        @media (max-width: 768px) {
            #main-content { margin-top: 60px; }
            #app-frame { height: calc(100vh - 60px); }
            #shell-loader { inset: 60px 0 0 0; }
        }
    </style>
</head>
<body data-theme="light">

    <!-- ===== 1. CAMADA DE DADOS (planilha Google Sheets) + versão/cache global ===== -->
    <script src="js/portal-db.js"></script>

    <!-- ===== 2. MENU GLOBAL / NAVEGAÇÃO / LOGIN (depende do portal-db.js) ===== -->
    <script src="menu.js"></script>

    <!-- ===== 3. CONTEÚDO: todas as páginas (inclusive a home) abrem aqui ===== -->
    <div id="main-content">
        <iframe id="app-frame" src="" title="Conteúdo do Portal"></iframe>
    </div>

    <div id="shell-loader">
        <div class="shell-spinner"></div>
        <div class="shell-loader-txt">Carregando portal…</div>
    </div>

    <script>
        // Esconde o loader assim que a página dentro do iframe terminar de carregar.
        (function () {
            var frame = document.getElementById('app-frame');
            var loader = document.getElementById('shell-loader');
            function esconder() { if (loader) loader.classList.add('hidden'); }
            if (frame) frame.addEventListener('load', esconder);
            setTimeout(esconder, 6000); // rede lenta: nunca deixa o loader travado
        })();
    </script>

</body>
</html>
