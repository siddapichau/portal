<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Reportes - Mercado Livre</title>
    
    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png" type="image/png">
    <link rel="stylesheet" href="style.css">

    <style>
        :root { --bg-gradient: radial-gradient(circle at top right, #1e3c72 0%, #0f172a 40%, #050505 100%); }
        [data-theme="light"] { --bg-gradient: #ffffff; }
        
        body { background: var(--bg-gradient); background-attachment: fixed; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-y: hidden; }
        
        #main-content { margin-top: 80px; width: 100%; max-width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 15px; flex: 1; transition: 0.3s; }

        .main-title { font-size: 2.2rem; font-weight: 900; color: var(--text-title); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; position: relative; padding-bottom: 12px; text-align: center; }
        .main-title::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 70px; height: 4px; background-color: var(--accent-blue); border-radius: 2px; }

        .quote-container { background: var(--bg-card); border-left: 4px solid var(--accent-blue); border-radius: 8px; padding: 15px 25px; box-shadow: var(--shadow-card); max-width: 800px; width: 100%; margin-bottom: 30px; position: relative; overflow: hidden; text-align: center; }
        .quote-text { font-size: 1rem; color: var(--text-main); font-style: italic; font-weight: 600; transition: opacity 0.5s ease; }
        .progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent-blue); width: 0%; }

        /* =========================================
           GRID DE 3 COLUNAS (DENTRO DO HOME-VIEW)
           ========================================= */
        #home-view { width: 100%; max-width: 1500px; display: grid; grid-template-columns: 320px 1fr 300px; gap: 20px; height: calc(100vh - 250px); margin-bottom: 20px; }

        .panel-box { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; overflow: hidden; }
        
        .panel-header { background: rgba(52, 131, 250, 0.05); padding: 15px 20px; border-bottom: 1px solid var(--border-card); display: flex; justify-content: space-between; align-items: center; }
        .panel-header h2 { font-size: 1rem; color: var(--text-title); display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 900;}
        
        .panel-content { flex: 1; overflow-y: auto; padding: 0; display: flex; flex-direction: column;}
        
        .panel-content::-webkit-scrollbar { width: 6px; }
        .panel-content::-webkit-scrollbar-track { background: transparent; }
        .panel-content::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 4px; }
        
        .muted-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); font-weight: 600; }
        .error-msg { text-align: center; padding: 40px 20px; color: #FF5252; font-weight: 600; }

        /* --- COLUNA 1: LOGS --- */
        .live-indicator { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }

        .feed-list { list-style: none; padding: 0; margin: 0; }
        .feed-item { padding: 15px 20px; border-bottom: 1px solid var(--border-card); display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; transition: background 0.2s; }
        .feed-item:hover { background: rgba(52, 131, 250, 0.05); }
        .feed-item:last-child { border-bottom: none; }
        
        .feed-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .feed-details { display: flex; flex-direction: column; gap: 3px; margin-top: -2px;}
        .feed-module { font-size: 0.7rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .feed-action { font-size: 0.85rem; color: var(--text-main); font-weight: 600; line-height: 1.3;}
        .feed-meta { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 5px; margin-top: 4px;}
        .feed-meta strong { color: var(--accent-blue); font-weight: 800; }

        /* --- COLUNA 2: NOTÍCIAS --- */
        .news-header-banner { background: #FFF159; color: #2D3277; padding: 10px; text-align: center; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        
        .post-card { padding: 20px; border-bottom: 4px solid var(--border-card); display: flex; flex-direction: column; gap: 12px; position: relative;}
        .post-card:last-child { border-bottom: none; }
        .post-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .post-author-box { display: flex; align-items: center; gap: 10px; }
        .author-avatar { width: 40px; height: 40px; background: var(--accent-blue); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; text-transform: uppercase;}
        .author-info { display: flex; flex-direction: column; }
        .author-name { font-weight: 900; color: var(--text-title); font-size: 0.95rem; }
        .post-date { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .post-tag { background: rgba(52, 131, 250, 0.15); color: var(--accent-blue); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; border: 1px solid rgba(52, 131, 250, 0.3);}
        
        .post-title { font-size: 1.1rem; font-weight: 900; color: var(--text-title); line-height: 1.3;}
        .post-body { font-size: 0.9rem; color: var(--text-main); line-height: 1.5; white-space: pre-wrap; word-break: break-word;}
        .post-body img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
        .post-body a { color: var(--accent-blue); font-weight: bold; text-decoration: underline; }
        
        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; padding-top: 15px; border-top: 1px solid var(--border-card); }
        .ml-signature { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; display: flex; align-items: center; gap: 6px; font-style: italic;}
        .ml-signature img { height: 14px; opacity: 0.7;}
        
        .btn-like { background: transparent; border: 1px solid var(--border-card); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.85rem; transition: 0.3s; position: relative; overflow: hidden;}
        .btn-like:hover { background: rgba(52, 131, 250, 0.1); border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn-like.liked { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        
        .like-anim-text { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-weight: 900; color: var(--accent-blue); font-size: 0.8rem; opacity: 0; pointer-events: none; white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
        @keyframes flyUp { 0% { bottom: 0%; opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { bottom: 150%; opacity: 0; transform: translate(-50%, -20px) scale(1.2); } }
        .like-anim-text.animate { animation: flyUp 1s ease-out forwards; }

        /* --- COLUNA 3: USUÁRIOS E STATUS --- */
        .user-group-title { background: rgba(0,0,0,0.2); padding: 8px 15px; font-size: 0.75rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border-card); border-top: 1px solid var(--border-card);}
        [data-theme="light"] .user-group-title { background: rgba(0,0,0,0.03); }
        .user-group-title:first-child { border-top: none; }
        
        .user-list { list-style: none; padding: 0; margin: 0; }
        .user-item { padding: 12px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-card); }
        .user-item:last-child { border-bottom: none; }
        .user-avatar { width: 32px; height: 32px; background: var(--bg-body); border: 1px solid var(--border-card); color: var(--text-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; }
        
        .user-info { display: flex; flex-direction: column; gap: 2px;}
        .user-name { font-weight: 800; font-size: 0.85rem; color: var(--text-title); display: flex; align-items: center; gap: 6px;}
        .user-role { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;}
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block;}
        .dot-online { background-color: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }
        .dot-offline { background-color: var(--text-muted); }
        .dot-new { background-color: var(--accent-warn); }

        #app-frame { display: none; width: 100%; height: calc(100vh - 90px); border: none; border-radius: 12px; background: var(--bg-body); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        @media (max-width: 1100px) {
            #home-view { grid-template-columns: 1fr 300px; height: auto; }
            .col-news { grid-column: 1 / -1; order: -1; max-height: 500px;}
        }
        @media (max-width: 768px) {
            #home-view { grid-template-columns: 1fr; }
            .col-news, .panel-box { max-height: 400px; }
        }
    </style>
</head>
<body data-theme="light">

    <script src="menu.js"></script>

    <div id="main-content">
        <h1 class="main-title" id="page-title">Portal de Controles Internos</h1>

        <div class="quote-container" id="quote-box">
            <span id="animated-quote" class="quote-text">"Carregando a missão do dia..."</span>
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="home-view">
            
            <!-- COLUNA 1: LOGS -->
            <div class="panel-box col-logs">
                <div class="panel-header">
                    <h2><div class="live-indicator" title="Monitorando ao vivo"></div> Radar de Atividades</h2>
                </div>
                <div class="panel-content">
                    <ul class="feed-list" id="feed-list">
                        <div class="muted-msg">Conectando à Central...</div>
                    </ul>
                </div>
            </div>

            <!-- COLUNA 2: NOTÍCIAS -->
            <div class="panel-box col-news">
                <div class="news-header-banner">
                    📢 ÚLTIMAS NOVIDADES E ATUALIZAÇÕES LOGÍSTICAS
                </div>
                <div class="panel-content" id="news-feed-container">
                    <div class="muted-msg">Carregando mural...</div>
                </div>
            </div>

            <!-- COLUNA 3: USUÁRIOS E PRESENÇA -->
            <div class="panel-box col-users">
                <div class="panel-header">
                    <h2>👥 Equipe no Portal</h2>
                </div>
                <div class="panel-content" id="users-feed-container">
                    <div class="muted-msg">Mapeando presenças...</div>
                </div>
            </div>

        </div>

        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        const FIREBASE_URL = "https://reportes-bdb0a-default-rtdb.firebaseio.com/";
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwATV05zjehqTqkXjCRWCaQ9Kp7Y6gN19IJ7IdHtcEK9vflhWAkhSyMdEBG_uB8BN0SYA/exec";
        
        let CURRENT_LOGGED_USER = null;
        try { CURRENT_LOGGED_USER = JSON.parse(localStorage.getItem('loggedUser')); } catch(e) {}
        let currentUserStr = (CURRENT_LOGGED_USER && CURRENT_LOGGED_USER.usuario) ? CURRENT_LOGGED_USER.usuario : 'Você';
        let currentRoleStr = (CURRENT_LOGGED_USER && CURRENT_LOGGED_USER.cargo) ? CURRENT_LOGGED_USER.cargo : 'Acesso Local';

        // ==========================================
        // CITAÇÕES ANIMADAS
        // ==========================================
        const messages = [ "O talento vence jogos, mas o trabalho em equipe e a inteligência vencem campeonatos.", "Um inventário preciso é o coração da nossa logística.", "No Mercado Livre, não entregamos apenas pacotes, entregamos propósitos.", "Nossa força está na união. Juntos, fazemos do nosso inventário um modelo de eficiência." ];
        let msgIndex = 0; const quoteEl = document.getElementById('animated-quote'); const progressBar = document.getElementById('progress-bar'); const INTERVAL_MS = 10000;

        function startMessageCycle() {
            if(!quoteEl) return; quoteEl.innerText = messages[msgIndex]; animateProgressBar();
            setInterval(() => { quoteEl.style.opacity = 0; setTimeout(() => { msgIndex = (msgIndex + 1) % messages.length; quoteEl.innerText = messages[msgIndex]; quoteEl.style.opacity = 1; animateProgressBar(); }, 500); }, INTERVAL_MS);
        }
        function animateProgressBar() { progressBar.style.transition = 'none'; progressBar.style.width = '0%'; void progressBar.offsetWidth; progressBar.style.transition = `width ${INTERVAL_MS}ms linear`; progressBar.style.width = '100%'; }
        
        // ==========================================
        // FUNÇÃO DE TIMEOUT PARA O FETCH (EVITAR TRAVAMENTOS)
        // ==========================================
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 8000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        }

        // ==========================================
        // COLUNA 1: LOGS DE ATIVIDADE
        // ==========================================
        async function carregarFeedAtualizacoes() {
            const listEl = document.getElementById('feed-list');
            try {
                const res = await fetchWithTimeout(`${FIREBASE_URL}logs.json?_=${Date.now()}`); 
                const data = await res.json();
                
                if(!data) { listEl.innerHTML = '<div class="muted-msg">Nenhuma atividade recente.</div>'; return; }
                
                let logs = [];
                if (Array.isArray(data)) { logs = data.filter(Boolean); } else { logs = Object.keys(data).map(key => data[key]); }
                
                logs.sort((a, b) => b.timestamp - a.timestamp); logs = logs.slice(0, 15); 
                listEl.innerHTML = '';
                
                logs.forEach(log => {
                    const dataFormatada = new Date(log.timestamp).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                    let icon = '📝'; let bgStyle = 'rgba(52, 131, 250, 0.1)'; let colorStyle = 'var(--accent-blue)';
                    const actionTxt = String(log.acao || '').toLowerCase();
                    
                    if (actionTxt.includes('adicionou') || actionTxt.includes('criou') || actionTxt.includes('publicou')) { icon = '✨'; bgStyle = 'rgba(0, 166, 80, 0.1)'; colorStyle = 'var(--accent-green)'; } 
                    else if (actionTxt.includes('removeu') || actionTxt.includes('excluiu') || actionTxt.includes('apagou')) { icon = '🗑️'; bgStyle = 'rgba(255, 82, 82, 0.1)'; colorStyle = 'var(--accent-red)'; }
                    else if (actionTxt.includes('sincronizou')) { icon = '🔄'; bgStyle = 'rgba(255, 176, 0, 0.1)'; colorStyle = 'var(--accent-warn)'; }

                    listEl.innerHTML += `
                        <li class="feed-item">
                            <div class="feed-icon" style="background: ${bgStyle}; color: ${colorStyle};">${icon}</div>
                            <div class="feed-details">
                                <span class="feed-module">${log.modulo || 'Sistema'}</span>
                                <span class="feed-action">${log.acao}</span>
                                <span class="feed-meta">Por <strong>${log.usuario || 'Desconhecido'}</strong> • ${dataFormatada}</span>
                            </div>
                        </li>
                    `;
                });
            } catch (e) { 
                console.error("Erro Logs:", e);
                if(listEl.innerHTML.includes('Conectando')) listEl.innerHTML = '<div class="error-msg">Erro ao carregar o radar de atividades.</div>'; 
            } 
        }

        // ==========================================
        // COLUNA 2: MURAL DE NOTÍCIAS
        // ==========================================
        async function carregarNoticias() {
            const container = document.getElementById('news-feed-container');
            try {
                const res = await fetchWithTimeout(`${FIREBASE_URL}portal_news.json?_=${Date.now()}`);
                let data = await res.json();
                
                if(!data) {
                    container.innerHTML = '<div class="muted-msg">Ainda não há publicações no mural.</div>';
                    return;
                }

                let newsList = [];
                if (Array.isArray(data)) { newsList = data.map((v, i) => ({...v, key: i})).filter(v => v && v.id); } 
                else { newsList = Object.keys(data).map(k => ({...data[k], key: k})); }
                
                newsList.sort((a,b) => b.data - a.data);
                container.innerHTML = '';

                newsList.forEach(news => {
                    const dataFormatada = new Date(news.data).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                    const inicial = (news.autor || 'A').charAt(0).toUpperCase();
                    
                    let userHasLiked = false;
                    if(news.likedBy && Array.isArray(news.likedBy) && news.likedBy.includes(currentUserStr)) {
                        userHasLiked = true;
                    }

                    const btnClass = userHasLiked ? 'btn-like liked' : 'btn-like';
                    
                    container.innerHTML += `
                        <div class="post-card">
                            <div class="post-header">
                                <div class="post-author-box">
                                    <div class="author-avatar">${inicial}</div>
                                    <div class="author-info">
                                        <span class="author-name">${news.autor || 'Admin'}</span>
                                        <span class="post-date">${dataFormatada}</span>
                                    </div>
                                </div>
                                <span class="post-tag">${news.tag || 'Aviso'}</span>
                            </div>
                            
                            <div class="post-title">${news.titulo || ''}</div>
                            <div class="post-body">${news.corpo || ''}</div>
                            
                            <div class="post-footer">
                                <div class="ml-signature">
                                    <img src="https://upload.wikimedia.org/wikipedia/pt/0/04/Logotipo_MercadoLivre.png" alt="ML"> Equipe Inventário
                                </div>
                                <button class="${btnClass}" id="btn-like-${news.key}" onclick="darLikeNews('${news.key}')">
                                    🚀 <span id="like-count-${news.key}">${news.likes || 0}</span>
                                    <span class="like-anim-text" id="like-anim-${news.key}">Para Cima!</span>
                                </button>
                            </div>
                        </div>
                    `;
                });
                
            } catch (e) {
                console.error("Erro Noticias:", e);
                if(container.innerHTML.includes('Carregando')) container.innerHTML = '<div class="error-msg">Falha ao obter mural de notícias.</div>';
            }
        }

        async function darLikeNews(newsKey) {            
            const btn = document.getElementById(`btn-like-${newsKey}`);
            const countSpan = document.getElementById(`like-count-${newsKey}`);
            const animSpan = document.getElementById(`like-anim-${newsKey}`);
            
            try {
                const res = await fetch(`${FIREBASE_URL}portal_news/${newsKey}.json`);
                const news = await res.json();
                if(!news) return;

                let likedBy = news.likedBy || [];
                let currentLikes = parseInt(news.likes) || 0;

                if (likedBy.includes(currentUserStr)) {
                    likedBy = likedBy.filter(u => u !== currentUserStr);
                    currentLikes--;
                    btn.classList.remove('liked');
                } else {
                    likedBy.push(currentUserStr);
                    currentLikes++;
                    btn.classList.add('liked');
                    
                    animSpan.classList.remove('animate');
                    void animSpan.offsetWidth; 
                    animSpan.classList.add('animate');
                }

                countSpan.innerText = currentLikes;

                await fetch(`${FIREBASE_URL}portal_news/${newsKey}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ likes: currentLikes, likedBy: likedBy })
                });

            } catch(e) { console.error("Erro ao computar like."); }
        }

        // ==========================================
        // COLUNA 3: USUÁRIOS E PRESENÇA AO VIVO
        // ==========================================
        function formatRoleName(role) {
            if(!role) return 'Desconhecido';
            const r = role.toLowerCase();
            if(r === 'view2') return 'View Plus';
            if(r === 'view') return 'Viewer';
            if(r === 'editor') return 'Editor';
            if(r === 'admin') return 'Admin';
            return role;
        }

        function registrarPresenca() {
            if(currentUserStr !== 'Você' && currentUserStr !== 'Sistema') {
                fetch(`${FIREBASE_URL}presence/${currentUserStr}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ cargo: currentRoleStr, lastSeen: Date.now() })
                }).catch(e => console.log(e));
            }
        }

        async function carregarPresencaUsuarios() {
            const container = document.getElementById('users-feed-container');
            
            try {
                let presenceData = {};
                try {
                    const resP = await fetchWithTimeout(`${FIREBASE_URL}presence.json?_=${Date.now()}`, { timeout: 5000 });
                    presenceData = await resP.json() || {};
                } catch(errP) { console.warn("Erro ao buscar presença do Firebase."); }
                
                const now = Date.now();
                const onlineUsers = Object.keys(presenceData).filter(u => now - presenceData[u].lastSeen < 120000).map(u => ({ nome: u, cargo: formatRoleName(presenceData[u].cargo) }));

                let allUsers = JSON.parse(sessionStorage.getItem('cachedUsersList')) || null;
                
                if (!allUsers) {
                    try {
                        const resU = await fetchWithTimeout(APP_SCRIPT_URL, { 
                            method: 'POST', 
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            redirect: "follow",
                            body: JSON.stringify({ action: "getUsers" }),
                            timeout: 8000
                        });
                        const dataU = await resU.json();
                        if(dataU.success) { 
                            allUsers = dataU.users; 
                            sessionStorage.setItem('cachedUsersList', JSON.stringify(allUsers)); 
                        } else { allUsers = []; }
                    } catch(errScript) {
                        console.error("Script demorou muito ou falhou:", errScript);
                        allUsers = [];
                    }
                }
                
                let pendentes = allUsers.filter(u => u.solicitacao === 'pendente').slice(0, 2);
                let ultimosLogados = allUsers.filter(u => u.solicitacao === 'aprovado' && u.usuario !== currentUserStr && !onlineUsers.some(ou => ou.nome === u.usuario)).slice(0, 5);

                let html = '';

                html += `<div class="user-group-title">🟢 Agora no Portal</div><ul class="user-list">`;
                
                if(currentUserStr !== 'Você') {
                    html += `
                        <li class="user-item">
                            <div class="user-avatar" style="background: rgba(0, 166, 80, 0.1); color: var(--accent-green); border-color: var(--accent-green);">${currentUserStr.charAt(0).toUpperCase()}</div>
                            <div class="user-info">
                                <span class="user-name">${currentUserStr} (Você) <div class="status-dot dot-online"></div></span>
                                <span class="user-role">${formatRoleName(currentRoleStr)}</span>
                            </div>
                        </li>
                    `;
                }

                onlineUsers.forEach(ou => {
                    if(ou.nome !== currentUserStr) {
                        html += `
                            <li class="user-item">
                                <div class="user-avatar" style="background: rgba(52, 131, 250, 0.1); color: var(--accent-blue);">${ou.nome.charAt(0).toUpperCase()}</div>
                                <div class="user-info">
                                    <span class="user-name">${ou.nome} <div class="status-dot dot-online"></div></span>
                                    <span class="user-role">${ou.cargo}</span>
                                </div>
                            </li>
                        `;
                    }
                });
                
                if (onlineUsers.length === 0 && currentUserStr === 'Você') {
                    html += `<li class="user-item"><div class="user-info"><span class="user-role" style="text-transform: none;">Ninguém online no momento.</span></div></li>`;
                }
                html += `</ul>`;

                if(ultimosLogados.length > 0) {
                    html += `<div class="user-group-title">⏱️ Acessos Recentes</div><ul class="user-list">`;
                    ultimosLogados.forEach(u => {
                        html += `
                            <li class="user-item">
                                <div class="user-avatar">${u.usuario.charAt(0).toUpperCase()}</div>
                                <div class="user-info">
                                    <span class="user-name">${u.usuario} <div class="status-dot dot-offline"></div></span>
                                    <span class="user-role">${formatRoleName(u.cargo)}</span>
                                </div>
                            </li>
                        `;
                    });
                    html += `</ul>`;
                }

                if(pendentes.length > 0) {
                    html += `<div class="user-group-title">🆕 Novos Cadastros</div><ul class="user-list">`;
                    pendentes.forEach(u => {
                        html += `
                            <li class="user-item">
                                <div class="user-avatar" style="background: rgba(255, 176, 0, 0.1); border-color: var(--accent-warn); color: var(--accent-warn);">${u.usuario.charAt(0).toUpperCase()}</div>
                                <div class="user-info">
                                    <span class="user-name">${u.usuario} <div class="status-dot dot-new"></div></span>
                                    <span class="user-role" style="color: var(--accent-warn);">Aguardando Aprovação</span>
                                </div>
                            </li>
                        `;
                    });
                    html += `</ul>`;
                }

                container.innerHTML = html;

            } catch (e) {
                console.error("Erro painel de presença completo:", e);
                if(container.innerHTML.includes('Mapeando')) container.innerHTML = '<div class="error-msg">Falha ao sincronizar usuários.</div>';
            }
        }

        // ==========================================
        // INICIALIZAÇÃO SEGURA E INDEPENDENTE
        // ==========================================
        setTimeout(() => { 
            startMessageCycle(); 
            registrarPresenca();
            
            // Cada função roda de forma paralela e independente! Se uma falhar, a outra continua.
            carregarFeedAtualizacoes(); 
            carregarNoticias();
            carregarPresencaUsuarios();

            setInterval(() => { 
                registrarPresenca();
                carregarFeedAtualizacoes(); 
                carregarNoticias();
                carregarPresencaUsuarios();
            }, 30000); 

        }, 500);

    </script>
</body>
</html>
