<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Controles Internos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #main-content { padding: 100px 20px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .welcome-box { background: var(--bg-card); border-radius: 12px; padding: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--border-card); max-width: 800px; width: 100%; }
    </style>
</head>
<body data-theme="light">
    <!-- SCRIPTS CORE -->
    <script src="js/firebase.config.js"></script>
    <script src="menu.js"></script>

    <div id="main-content">
        <div class="welcome-box">
            <h1 style="color: var(--text-title); margin-bottom: 10px;">Bem-vindo ao Portal</h1>
            <p style="color: var(--text-muted);">Use o botão ☰ no canto superior esquerdo para navegar e marcar seus favoritos!</p>
        </div>
    </div>
</body>
</html>
