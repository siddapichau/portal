<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Reportes - Mercado Livre</title>
    
    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png" type="image/png">
    <link rel="stylesheet" href="style.css">

    <style>
        :root { --bg-gradient: radial-gradient(circle at top right, #1e3c72 0%, #0f172a 40%, #050505 100%); }
        [data-theme="light"] { --bg-gradient: #ffffff; /* Fundo Sólido no Claro */ }
        
        body { background: var(--bg-gradient); background-attachment: fixed; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-y: hidden; }
        
        #main-content { margin-top: 80px; width: 100%; max-width: 1400px; display: flex; flex-direction: column; align-items: center; padding: 0 20px; flex: 1; transition: 0.3s; }

        .main-title { font-size: 2.2rem; font-weight: 900; color: var(--text-title); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; position: relative; padding-bottom: 12px; text-align: center; }
        .main-title::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 70px; height: 4px; background-color: var(--accent-blue); border-radius: 2px; }

        .quote-container { background: var(--bg-card); border-left: 4px solid var(--accent-blue); border-radius: 8px; padding: 15px 25px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); max-width: 600px; width: 100%; margin-bottom: 30px; position: relative; overflow: hidden; text-align: center; }
        .quote-text { font-size: 1rem; color: var(--text-main); font-style: italic; font-weight: 600; transition: opacity 0.5s ease; }
        .progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent-blue); width: 0%; }

        /* PAINEL DE ÚLTIMAS ATUALIZAÇÕES */
        .feed-box {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow-card);
        }
        .feed-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            border-bottom: 2px solid var(--border-card); padding-bottom: 10px;
        }
        .feed-header h2 { font-size: 1.2rem; color: var(--text-title); display: flex; align-items: center; gap: 8px;}
        .feed-refresh { background: transparent; border: none; color: var(--accent-blue); font-weight: bold; cursor: pointer; }
        
        .feed-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
        .feed-item {
            padding: 12px 0; border-bottom: 1px solid var(--border-card);
            display: flex; flex-direction: column; gap: 4px;
        }
        .feed-item:last-child { border-bottom: none; }
        .feed-module { font-size: 0.75rem; font-weight: 800; color: var(--accent-blue); text-transform: uppercase; }
        .feed-action { font-size: 0.95rem; color: var(--text-main); font-weight: 600; line-height: 1.3;}
        .feed-meta { font-size: 0.75rem; color: var(--text-muted); font-weight: 600;}

        /* O IFRAME QUE VAI CARREGAR AS PÁGINAS */
        #app-frame {
            display: none; width: 100%; height: calc(100vh - 100px); border: none; border-radius: 12px; background: var(--bg-body); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body data-theme="light">

    <!-- SCRIPT DO MENU (Responsável por roteamento, autenticação, etc) -->
    <script src="menu.js"></script>

    <div id="main-content">
        <h1 class="main-title" id="page-title">Portal de Controles Internos</h1>

        <div class="quote-container" id="quote-box">
            <span id="animated-quote" class="quote-text">"Carregando a missão do dia..."</span>
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- NOVO: Feed de Atualizações -->
        <div class="feed-box" id="home-view">
            <div class="feed-header">
                <h2>⚡ Últimas Atualizações</h2>
                <button class="feed-refresh" onclick="carregarFeedAtualizacoes()">🔄 Atualizar</button>
            </div>
            <ul class="feed-list" id="feed-list">
                <div style="text-align:center; padding: 20px; color: var(--text-muted);">Buscando atualizações...</div>
            </ul>
        </div>

        <!-- ONDE AS PÁGINAS VÃO ABRIR -->
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        const messages = [ "O talento vence jogos, mas o trabalho em equipe e a inteligência vencem campeonatos.", "Um inventário preciso é o coração da nossa logística.", "No Mercado Livre, não entregamos apenas pacotes, entregamos propósitos.", "Nossa força está na união. Juntos, fazemos do nosso inventário um modelo de eficiência." ];
        let msgIndex = 0;
        const quoteEl = document.getElementById('animated-quote');
        const progressBar = document.getElementById('progress-bar');
        const INTERVAL_MS = 10000;

        function startMessageCycle() {
            if(!quoteEl) return;
            quoteEl.innerText = messages[msgIndex];
            animateProgressBar();
            setInterval(() => {
                quoteEl.style.opacity = 0;
                setTimeout(() => {
                    msgIndex = (msgIndex + 1) % messages.length;
                    quoteEl.innerText = messages[msgIndex];
                    quoteEl.style.opacity = 1;
                    animateProgressBar();
                }, 500);
            }, INTERVAL_MS);
        }

        function animateProgressBar() {
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            void progressBar.offsetWidth; 
            progressBar.style.transition = `width ${INTERVAL_MS}ms linear`;
            progressBar.style.width = '100%';
        }
        
        // --- SISTEMA DE LOGS NO INDEX ---
        async function carregarFeedAtualizacoes() {
            const listEl = document.getElementById('feed-list');
            try {
                // A URL DO FIREBASE VEM DO MENU.JS, MAS PODEMOS DECLARAR AQUI PARA GARANTIA
                const fb_url = "https://reportes-bdb0a-default-rtdb.firebaseio.com/";
                const res = await fetch(`${fb_url}logs.json`);
                const data = await res.json();
                
                if(!data) {
                    listEl.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Nenhuma atividade registrada ainda.</div>';
                    return;
                }

                // Converter objeto Firebase em Array e ordenar do mais recente pro mais antigo
                let logs = Object.keys(data).map(key => data[key]);
                logs.sort((a, b) => b.timestamp - a.timestamp);
                
                // Pega os 10 últimos
                logs = logs.slice(0, 10);
                
                listEl.innerHTML = '';
                logs.forEach(log => {
                    const dataFormatada = new Date(log.timestamp).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                    listEl.innerHTML += `
                        <li class="feed-item">
                            <span class="feed-module">${log.modulo}</span>
                            <span class="feed-action">${log.acao}</span>
                            <span class="feed-meta">Por <strong>${log.usuario}</strong> em ${dataFormatada}</span>
                        </li>
                    `;
                });
            } catch (e) {
                listEl.innerHTML = '<div style="text-align:center; padding: 20px; color: #FF5252;">Erro ao carregar o feed.</div>';
            }
        }

        setTimeout(() => {
            startMessageCycle();
            carregarFeedAtualizacoes();
        }, 500);
    </script>
</body>
</html>
