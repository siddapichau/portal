<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Insumos - Mercado Livre</title>
    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* =========================================
           SISTEMA DE TEMAS E GRADIENTES PADRÃO (GLASS)
           ========================================= */
        :root {
            --bg-gradient: radial-gradient(circle at top right, #1e3c72 0%, #0f172a 40%, #050505 100%);
            --bg-card: rgba(30, 41, 59, 0.6); 
            --bg-header: rgba(15, 23, 42, 0.6);
            --bg-input: rgba(15, 23, 42, 0.8);
            --bg-hover: rgba(30, 41, 59, 0.85);
            --text-main: #EBEBEB;
            --text-muted: #94a3b8;
            --text-title: #FFFFFF;
            --accent-yellow: #FFF159;
            --accent-blue: #3483FA;
            --accent-green: #00A650;
            --accent-red: #FF5252;
            --accent-warn: #FFB000;
            --border-card: rgba(255, 255, 255, 0.1);
            --border-light: rgba(255, 255, 255, 0.2);
            --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at top right, #a1c4fd 0%, #e2ebf0 40%, #f1f5f9 100%);
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-header: rgba(255, 255, 255, 0.9);
            --bg-input: rgba(255, 255, 255, 0.9);
            --bg-hover: rgba(255, 255, 255, 0.95);
            --text-main: #334155;
            --text-muted: #64748b;
            --text-title: #1e293b;
            --accent-yellow: #B48B00;
            --accent-blue: #3483FA;
            --accent-green: #00A650;
            --accent-red: #E91E63;
            --accent-warn: #B48B00;
            --border-card: rgba(255, 255, 255, 0.5);
            --border-light: rgba(0, 0, 0, 0.1);
            --shadow-card: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 8px;
            transition: background .5s ease, color .3s ease;
        }

        .top-header {
            background-color: #FFF159 !important;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            color: #2D3277;
            border-radius: 10px;
            padding: 10px 16px;
            display: grid;
            grid-template-columns: 170px 1fr auto;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .ml-logo {
            height: 28px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .ml-logo:hover { transform: scale(1.05); }

        .header-center {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 900;
            color: #2D3277 !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .header-right .status-badge,
        .header-right .theme-toggle {
            background: #FFFFFF !important;
            color: #333333 !important;
            border: 1px solid rgba(0,0,0,0.1) !important;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .status-badge {
            white-space: nowrap;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }
        .theme-toggle:hover { background: #f1f1f1 !important; transform: translateY(-2px); }

        .btn-action {
            border-radius: 6px;
            padding: 6px 14px;
            font-size: .8rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.25s ease-in-out;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-blue {
            background: var(--accent-blue);
            color: #fff;
            border: none;
        }
        .btn-blue:hover { background: #2968c8; transform: translateY(-2px); }

        .btn-dark {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            border: 1px solid var(--border-card);
        }
        .btn-dark:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        [data-theme="light"] .btn-dark {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-light);
        }
        [data-theme="light"] .btn-dark:hover { background: rgba(0, 0, 0, 0.1); }

        .filter-card {
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-card);
        }

        .filter-card label {
            color: var(--text-muted);
            font-size: .78rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .filter-card select {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 7px 10px;
            outline: none;
            min-width: 260px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
        }

        .total-info {
            margin-left: auto;
            color: var(--text-title);
            font-size: .88rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .table-wrapper {
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            overflow: auto;
            box-shadow: var(--shadow-card);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-card);
            text-align: left;
            font-size: .88rem;
            color: var(--text-main);
        }

        th {
            background: var(--bg-header);
            color: var(--text-title);
            text-transform: uppercase;
            font-size: .74rem;
            font-weight: 900;
            position: sticky;
            top: 0;
        }

        tr {
            transition: background-color 0.2s;
        }

        tr:hover td {
            background-color: rgba(255,255,255,0.08);
        }
        [data-theme="light"] tr:hover td {
            background-color: rgba(0,0,0,0.04);
        }

        .center {
            text-align: center;
        }

        .muted {
            color: var(--text-muted);
            text-align: center;
            padding: 28px !important;
            font-weight: 900;
        }

        .col-name {
            font-weight: 700;
        }

        .col-date {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .col-estoque {
            font-weight: 900;
        }

        .stock-ok {
            color: var(--accent-green);
        }

        .stock-warn {
            color: var(--accent-warn);
        }

        .stock-bad {
            color: var(--accent-red);
        }

        .dot {
            display: inline-block;
            width: 13px;
            height: 13px;
            border-radius: 50%;
        }

        .dot-ok {
            background: var(--accent-green);
            box-shadow: 0 0 10px rgba(0,166,80,.75);
        }

        .dot-warn {
            background: var(--accent-warn);
            box-shadow: 0 0 10px rgba(255,176,0,.75);
        }

        .dot-bad {
            background: var(--accent-red);
            box-shadow: 0 0 10px rgba(255,82,82,.75);
        }

        /* Scrollbar estilizada */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-header); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 900px) {
            .top-header {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 8px;
            }

            .header-left,
            .header-right {
                justify-content: center;
            }

            .header-center {
                white-space: normal;
                font-size: .95rem;
            }

            .header-right {
                flex-wrap: wrap;
            }

            .filter-card {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-card select {
                width: 100%;
                min-width: unset;
            }

            .total-info {
                margin-left: 0;
                text-align: right;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 6px;
            }

            .header-right {
                display: grid;
                grid-template-columns: 1fr 1fr;
                width: 100%;
            }

            .status-badge {
                grid-column: 1 / -1;
                text-align: center;
            }

            .theme-toggle,
            .btn-action {
                width: 100%;
            }

            .ml-logo {
                height: 26px;
            }

            th, td {
                padding: 10px;
                font-size: .8rem;
            }
        }
    </style>
</head>

<body>
    <div class="top-header">
        <div class="header-left">
            <img src="https://upload.wikimedia.org/wikipedia/pt/0/04/Logotipo_MercadoLivre.png" class="ml-logo" alt="Mercado Livre" onclick="window.location.href='index.html'">
        </div>

        <div class="header-center" id="main-title">
            Estoque de Insumos Operacional Crítico
        </div>

        <div class="header-right">
            <span class="status-badge" id="data-status">Conectando ao banco...</span>

            <button class="theme-toggle" id="btnExportar" onclick="baixarDashboardComoImagem()" title="Exportar Tabela em Imagem UHD 4K">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span>Exportar 4K</span>
            </button>

            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Alternar Modo Claro/Escuro">
                <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span id="themeText">Claro</span>
            </button>

            <a href="contagem_insumos.html" class="btn-action btn-blue">Contagem</a>

            <button class="btn-action btn-dark" onclick="carregarDoFirebase()">Atualizar</button>
        </div>
    </div>

    <div class="filter-card">
        <label for="filter-categoria">Categoria:</label>

        <select id="filter-categoria">
            <option value="Todos">Todos</option>
        </select>

        <span class="total-info" id="total-info">0 itens</span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width:40%;">Nome do Material</th>
                    <th class="center" style="width:15%;">Última Atualização</th>
                    <th class="center" style="width:15%;">Estoque Segurança</th>
                    <th class="center" style="width:15%;">Estoque Atual</th>
                    <th class="center" style="width:15%;">Status</th>
                </tr>
            </thead>

            <tbody id="tbody-insumos">
                <tr>
                    <td class="muted" colspan="5">Carregando dados...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const FIREBASE_URL = "https://reportes-bdb0a-default-rtdb.firebaseio.com/";
        const FIREBASE_NODE = "insumos";

        const $ = (s) => document.querySelector(s);

        let ALL_ITEMS = [];

        function obterDataHojeFormatada() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = hoje.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }
        
        // Função auxiliar para extrair apenas a data de uma string "DD/MM/YYYY, HH:MM:SS"
        function extrairApenasData(dataCompleta) {
            if (!dataCompleta) return '-';
            return dataCompleta.split(' ')[0].replace(',', '');
        }

        function initTheme() {
            try {
                if (localStorage.getItem('themePreference') === 'light') {
                    document.body.setAttribute('data-theme', 'light');
                    updateThemeUI('light');
                } else {
                    updateThemeUI('dark');
                }
            } catch(e) {
                updateThemeUI('dark');
            }
        }

        function toggleTheme() {
            const newMode = document.body.getAttribute('data-theme') !== 'light' ? 'light' : 'dark';

            if (newMode === 'light') {
                document.body.setAttribute('data-theme', 'light');
            } else {
                document.body.removeAttribute('data-theme');
            }

            try {
                localStorage.setItem('themePreference', newMode);
            } catch(e) {}

            updateThemeUI(newMode);
        }

        function updateThemeUI(mode) {
            const themeText = document.getElementById('themeText');
            const themeIcon = document.getElementById('themeIcon');

            if (!themeText || !themeIcon) return;

            if (mode === 'light') {
                themeText.innerText = 'Escuro';
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            } else {
                themeText.innerText = 'Claro';
                themeIcon.innerHTML = `
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                `;
            }
        }

        function setStatus(texto, cor = "#FF7733") {
            const el = $('#data-status');
            el.innerText = texto;
            el.style.color = cor;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function escapeAttr(value) {
            return escapeHtml(value);
        }

        function toNumber(value) {
            if (value === null || value === undefined || value === '') return 0;
            let s = String(value).trim();
            if (!s) return 0;
            s = s.replace(/\./g, '').replace(',', '.');
            const n = Number(s);
            return Number.isFinite(n) ? n : 0;
        }

        function getValue(item, keys, fallback = '') {
            if (!item) return fallback; 
            for (const key of keys) {
                if (item[key] !== undefined && item[key] !== null && String(item[key]).trim() !== '') {
                    return item[key];
                }
            }
            const lowerMap = {};
            Object.keys(item || {}).forEach(k => {
                lowerMap[k.trim().toLowerCase()] = k;
            });
            for (const key of keys) {
                const found = lowerMap[String(key).trim().toLowerCase()];
                if (found && item[found] !== undefined && item[found] !== null && String(item[found]).trim() !== '') {
                    return item[found];
                }
            }
            return fallback;
        }

        function normalizeItem(row, index) {
            return {
                id_material: String(getValue(row, ['id_material', 'ID Material', 'Id Material', 'id'], index + 1)).trim(),
                Foto: String(getValue(row, ['Foto', 'foto'], '')).trim(),
                nome_material: String(getValue(row, ['nome_material', 'Nome do Material', 'nome', 'Material'], '')).trim(),
                categoria_material: String(getValue(row, ['categoria_material', 'Categoria', 'categoria'], 'Sem categoria')).trim() || 'Sem categoria',
                unidade: String(getValue(row, ['unidade', 'Unidade'], '')).trim(),
                tamanho: String(getValue(row, ['tamanho', 'Tamanho'], '')).trim(),
                estoque_segurança: getValue(row, ['estoque_segurança', 'Estoque Segurança', 'Estoque Seguranca', 'segurança', 'seguranca'], 0),
                Estoque_atual: getValue(row, ['Estoque_atual', 'estoque_atual', 'Estoque Atual'], 0),
                "Ultima contagem": String(getValue(row, ['Ultima contagem', 'Última contagem', 'ultima_contagem'], '')).trim(),
                Pedidos: String(getValue(row, ['Pedidos', 'pedidos'], '')).trim(),
                "Saldo _registrado": String(getValue(row, ['Saldo _registrado', 'Saldo registrado', 'saldo_registrado'], '')).trim(),
                "Total entradas": String(getValue(row, ['Total entradas', 'total_entradas'], '')).trim(),
                "Total saídas": String(getValue(row, ['Total saídas', 'Total saidas', 'total_saidas'], '')).trim()
            };
        }

        function semaforoClass(atual, seguranca) {
            atual = toNumber(atual);
            seguranca = toNumber(seguranca);

            if (seguranca <= 0) {
                return atual > 0 ? 'ok' : 'bad';
            }

            if (atual <= 0) return 'bad';
            if (atual < seguranca) return 'bad';
            if (atual <= seguranca * 1.2) return 'warn';

            return 'ok';
        }

        function formatNumberLikeOriginal(value) {
            if (value === null || value === undefined || value === '') return '0';
            const s = String(value).trim();
            if (!s) return '0';
            return s;
        }

        function fillCategorias(items) {
            const valorAtual = $('#filter-categoria').value || 'Todos';

            const cats = [...new Set(items.map(i => i.categoria_material || 'Sem categoria'))]
                .map(c => String(c).trim())
                .filter(Boolean)
                .sort((a,b) => a.localeCompare(b));

            const sel = $('#filter-categoria');

            sel.innerHTML = `<option value="Todos">Todos</option>` +
                cats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');

            if ([...sel.options].some(opt => opt.value === valorAtual)) {
                sel.value = valorAtual;
            }
        }

        function renderTabela(items) {
            const catSel = $('#filter-categoria').value;

            const filtered = items.filter(it => {
                return catSel === 'Todos' || String(it.categoria_material).trim() === catSel;
            });

            $('#total-info').innerText = `${items.length} itens`;

            if (filtered.length === 0) {
                $('#tbody-insumos').innerHTML = `
                    <tr>
                        <td class="muted" colspan="5">Nenhum item para este filtro.</td>
                    </tr>
                `;
                return;
            }

            const priority = {
                bad: 0,
                warn: 1,
                ok: 2
            };

            const sorted = [...filtered].sort((a,b) => {
                const sa = semaforoClass(a.Estoque_atual, a.estoque_segurança);
                const sb = semaforoClass(b.Estoque_atual, b.estoque_segurança);

                if (priority[sa] !== priority[sb]) {
                    return priority[sa] - priority[sb];
                }

                return String(a.nome_material).localeCompare(String(b.nome_material));
            });

            let html = '';

            for (const it of sorted) {
                const s = semaforoClass(it.Estoque_atual, it.estoque_segurança);

                const stockCls = s === 'ok' ? 'stock-ok' : s === 'warn' ? 'stock-warn' : 'stock-bad';
                const dotCls = s === 'ok' ? 'dot-ok' : s === 'warn' ? 'dot-warn' : 'dot-bad';
                
                const dataAtualizacao = extrairApenasData(it["Ultima contagem"]);

                html += `
                    <tr>
                        <td class="col-name">${escapeHtml(it.nome_material)}</td>
                        <td class="center col-date">${escapeHtml(dataAtualizacao)}</td>
                        <td class="center">${escapeHtml(formatNumberLikeOriginal(it.estoque_segurança))}</td>
                        <td class="center col-estoque ${stockCls}">${escapeHtml(formatNumberLikeOriginal(it.Estoque_atual))}</td>
                        <td class="center">
                            <span class="dot ${dotCls}"></span>
                        </td>
                    </tr>
                `;
            }

            $('#tbody-insumos').innerHTML = html;
        }

        async function carregarDoFirebase() {
            setStatus('Conectando ao banco...', '#3483FA');

            try {
                const response = await fetch(`${FIREBASE_URL}${FIREBASE_NODE}.json`);
                const dbData = await response.json();

                if (dbData && dbData.lista) {
                    ALL_ITEMS = [];
                    
                    if (Array.isArray(dbData.lista)) {
                        dbData.lista.forEach((row, index) => {
                            if (row !== null && row !== undefined) {
                                ALL_ITEMS.push(normalizeItem(row, index));
                            }
                        });
                    } else {
                        Object.keys(dbData.lista).forEach((key, index) => {
                            const row = dbData.lista[key];
                            if (row !== null && row !== undefined) {
                                ALL_ITEMS.push(normalizeItem(row, index));
                            }
                        });
                    }

                    ALL_ITEMS = ALL_ITEMS.filter(x => String(x.nome_material).trim() !== '');

                    fillCategorias(ALL_ITEMS);
                    renderTabela(ALL_ITEMS);

                    const dataDb = extrairApenasData(dbData.atualizadoEm) || 'Desconhecida';
                    setStatus(`Atualizado: ${dataDb}`, '#00A650');
                } else {
                    ALL_ITEMS = [];
                    fillCategorias(ALL_ITEMS);
                    renderTabela(ALL_ITEMS);

                    $('#tbody-insumos').innerHTML = `
                        <tr>
                            <td class="muted" colspan="5">
                                Banco vazio. Atualize os itens pela página Contagem de Insumos.
                            </td>
                        </tr>
                    `;

                    setStatus('Banco vazio.', '#FF7733');
                }
            } catch (error) {
                console.error(error);

                $('#tbody-insumos').innerHTML = `
                    <tr>
                        <td class="muted" colspan="5">
                            Não foi possível conectar ao Firebase. Verifique a conexão.
                        </td>
                    </tr>
                `;

                setStatus('Erro ao conectar no Firebase.', '#FF5252');
            }
        }

        // =========================================================================
        // EXPORTAÇÃO EM QUALIDADE ULTRA HD 4K
        // =========================================================================
        function baixarDashboardComoImagem() {
            if (!ALL_ITEMS || ALL_ITEMS.length === 0) {
                alert("Nenhum dado ativo para exportar.");
                return;
            }

            const statusBadge = document.getElementById('data-status');
            const txtOriginal = statusBadge.innerText;
            const corOriginal = statusBadge.style.color;
            
            statusBadge.innerText = 'Processando UHD 4K...';
            statusBadge.style.color = '#3483FA';

            // Oculta botões e áreas não relevantes para a foto
            const overrideStyle = document.createElement('style');
            overrideStyle.id = 'temp-capture-rules';
            overrideStyle.innerHTML = `
                #btnExportar, #themeToggle, .btn-action, .filter-card { display: none !important; }
                ::-webkit-scrollbar { display: none !important; }
                body, html { overflow: visible !important; height: auto !important; }
                .table-wrapper { overflow: visible !important; border: none !important; box-shadow: none !important;}
            `;
            document.head.appendChild(overrideStyle);

            setTimeout(() => {
                html2canvas(document.body, {
                    scale: 3, 
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: document.body.getAttribute('data-theme') === 'light' ? '#f1f5f9' : '#0b121f', 
                    logging: false
                }).then(canvas => {
                    if (document.getElementById('temp-capture-rules')) document.head.removeChild(overrideStyle);
                    
                    statusBadge.innerText = txtOriginal;
                    statusBadge.style.color = corOriginal;

                    const hoje = new Date();
                    const dataFormatada = `${String(hoje.getDate()).padStart(2, '0')}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${hoje.getFullYear()}`;
                    const link = document.createElement('a');
                    link.download = `Estoque_Insumos_${dataFormatada}_4K.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    console.error(err);
                    if (document.getElementById('temp-capture-rules')) document.head.removeChild(overrideStyle);
                    statusBadge.innerText = 'Erro na captura';
                    statusBadge.style.color = '#FF5252';
                });
            }, 300);
        }

        $('#filter-categoria').addEventListener('change', () => {
            renderTabela(ALL_ITEMS);
        });

        document.getElementById('main-title').innerText =
            `Estoque de Insumos Operacional Crítico - ${obterDataHojeFormatada()}`;

        initTheme();
        carregarDoFirebase();
    </script>
</body>
</html>
