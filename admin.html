<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gerenciar Menu Global</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #main-content { margin-top: 80px; padding: 20px; max-width: 1000px; margin: 80px auto; }
        .admin-container { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-card); }
        .header-actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .cat-card { background: var(--bg-body); border: 1px solid var(--border-card); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        
        /* Layout Submenus */
        .subitem-row { display: grid; grid-template-columns: 30px 1fr 1fr 1fr auto; gap: 10px; padding: 12px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 6px; margin-bottom: 5px; cursor: grab; align-items: center; }
        .subitem-row:active { cursor: grabbing; opacity: 0.8; }
        .subitem-row input { padding: 8px; border: 1px solid var(--border-card); background: var(--bg-body); color: var(--text-main); border-radius: 4px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-blue { background-color: var(--accent-blue); } .btn-green { background-color: var(--accent-green); } .btn-red { background-color: #FF5252; }
    </style>
</head>
<body data-theme="light">
    <!-- SCRIPTS CORE -->
    <script src="js/firebase.config.js"></script>
    <script src="menu.js"></script>

    <div id="main-content">
        <div class="admin-container" id="adminPanel" style="display:none;">
            <h2 style="margin-bottom: 15px; color: var(--text-title);">⚙️ Gerenciador de Menus</h2>
            
            <div class="header-actions">
                <button class="btn btn-blue" onclick="salvarNoFirebase()">💾 Salvar na Nuvem</button>
            </div>

            <div id="categorias-container"></div>
            <button class="btn btn-green" onclick="adicionarCategoria()" style="width: 100%; margin-top: 10px;">+ Adicionar Nova Categoria</button>
        </div>
        
        <div id="acessoNegado" style="display:none; text-align:center; padding: 50px;">
            <h2 style="color: #FF5252;">Acesso Negado 🛑</h2>
            <p>Você precisa estar logado com cargo de 'admin' para acessar esta página.</p>
        </div>
    </div>

    <script>
        let adMenuData = { categorias: [] };
        let draggedItem = null;

        window.onload = async () => {
            // VERIFICAÇÃO DE SEGURANÇA
            const userStr = localStorage.getItem('loggedUser');
            if(!userStr) { document.getElementById('acessoNegado').style.display = 'block'; return; }
            const user = JSON.parse(userStr);
            if(user.cargo !== 'admin') { document.getElementById('acessoNegado').style.display = 'block'; return; }

            document.getElementById('adminPanel').style.display = 'block';

            // Carrega dados
            try {
                const res = await fetch(`${FIREBASE_URL}menu_global.json`);
                const data = await res.json();
                adMenuData = data && data.categorias ? data : { categorias: [] };
            } catch (e) { console.log(e); }
            renderizarAdmin();
        };

        function renderizarAdmin() {
            const container = document.getElementById('categorias-container');
            container.innerHTML = '';

            adMenuData.categorias.forEach((cat, catIdx) => {
                let itemsHtml = '';
                (cat.items || []).forEach((item, itemIdx) => {
                    itemsHtml += `
                        <div class="subitem-row" draggable="true" ondragstart="dragStart(event, ${catIdx}, ${itemIdx})" ondragover="dragOver(event)" ondrop="drop(event, ${catIdx}, ${itemIdx})">
                            <span style="color:#888;">↕️</span>
                            <input type="text" placeholder="Título" value="${item.title || ''}" onchange="updateItem(${catIdx}, ${itemIdx}, 'title', this.value)">
                            <input type="text" placeholder="Descrição" value="${item.desc || ''}" onchange="updateItem(${catIdx}, ${itemIdx}, 'desc', this.value)">
                            <input type="text" placeholder="URL" value="${item.url || ''}" onchange="updateItem(${catIdx}, ${itemIdx}, 'url', this.value)">
                            <button class="btn btn-red" onclick="removerItem(${catIdx}, ${itemIdx})">✖</button>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="cat-card">
                        <div style="display:flex; gap:10px; margin-bottom:15px;">
                            <input type="text" value="${cat.category || ''}" onchange="updateCat(${catIdx}, 'category', this.value)" style="flex:1; padding:10px; font-weight:bold; border: 1px solid var(--border-card); border-radius:4px; background: var(--bg-body); color: var(--text-main);">
                            <button class="btn btn-red" onclick="removerCategoria(${catIdx})">Excluir Categoria</button>
                        </div>
                        <div style="margin-bottom:10px; font-weight:bold; font-size:0.85rem;">Submenus (Arraste para reordenar):</div>
                        ${itemsHtml}
                        <button class="btn" style="background:#444; margin-top:10px;" onclick="adicionarItem(${catIdx})">+ Adicionar Submenu</button>
                    </div>
                `;
            });
        }

        /* LÓGICA DE DRAG AND DROP CONFIÁVEL PARA SUBMENUS */
        function dragStart(e, catIdx, itemIdx) {
            draggedItem = { catIdx, itemIdx };
            e.dataTransfer.effectAllowed = 'move';
        }
        function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
        function drop(e, targetCatIdx, targetItemIdx) {
            e.preventDefault();
            if (!draggedItem || draggedItem.catIdx !== targetCatIdx) return; // Só move dentro da mesma categoria por segurança
            
            const cat = adMenuData.categorias[targetCatIdx];
            const itemToMove = cat.items.splice(draggedItem.itemIdx, 1)[0];
            cat.items.splice(targetItemIdx, 0, itemToMove);
            renderizarAdmin();
        }

        /* FUNÇÕES DE EDIÇÃO */
        function adicionarCategoria() { adMenuData.categorias.push({ category: "Nova Categoria", items: [] }); renderizarAdmin(); }
        function removerCategoria(idx) { adMenuData.categorias.splice(idx, 1); renderizarAdmin(); }
        function updateCat(idx, field, value) { adMenuData.categorias[idx][field] = value; }
        
        function adicionarItem(catIdx) { 
            if(!adMenuData.categorias[catIdx].items) adMenuData.categorias[catIdx].items = []; 
            adMenuData.categorias[catIdx].items.push({ title: "Novo Link", desc: "", url: "#" }); 
            renderizarAdmin(); 
        }
        function removerItem(catIdx, itemIdx) { adMenuData.categorias[catIdx].items.splice(itemIdx, 1); renderizarAdmin(); }
        function updateItem(catIdx, itemIdx, field, value) { adMenuData.categorias[catIdx].items[itemIdx][field] = value; }

        async function salvarNoFirebase() {
            try {
                await fetch(`${FIREBASE_URL}menu_global.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(adMenuData) });
                alert("Salvo com sucesso!");
            } catch(e) { alert("Erro ao salvar."); }
        }
    </script>
</body>
</html>
