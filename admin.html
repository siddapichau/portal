<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gerenciar Menu e Usuários</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #main-content { margin-top: 80px; padding: 20px; max-width: 1200px; margin: 80px auto; }
        .admin-container { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-card); }
        .header-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .admin-tabs { display: flex; border-bottom: 2px solid var(--border-card); margin-bottom: 20px; }
        .admin-tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .admin-tab.active { color: var(--accent-blue); border-bottom: 3px solid var(--accent-blue); }
        
        .cat-card { background: var(--bg-body); border: 1px solid var(--border-card); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .subitem-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 6px; margin-bottom: 5px; align-items: center; }
        .sub-subitem-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: var(--bg-body); border: 1px dashed var(--accent-blue); border-radius: 6px; margin-left: 40px; margin-top: 5px; }
        
        .subitem-row > input, .subitem-row > select, .sub-subitem-row > input, .sub-subitem-row > select { flex: 1; min-width: 100px; padding: 8px; border: 1px solid var(--border-card); background: var(--bg-body); color: var(--text-main); border-radius: 4px; font-size: 0.8rem;}
        
        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; font-size: 0.8rem;}
        .btn:hover { transform: translateY(-2px); }
        .btn-blue { background-color: var(--accent-blue); } .btn-green { background-color: var(--accent-green); } .btn-red { background-color: #FF5252; } .btn-dark { background-color: #334155; }

        .user-table { width: 100%; border-collapse: collapse; text-align: left; }
        .user-table th, .user-table td { padding: 12px; border-bottom: 1px solid var(--border-card); font-size: 0.85rem;}
        .user-table th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
        .user-table select { padding: 5px; border-radius: 4px; background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border-card); }
    </style>
</head>
<body data-theme="light">
    <script src="menu.js"></script>

    <div id="main-content">
        <div class="admin-container" id="adminPanel" style="display:none;">
            <h2 style="margin-bottom: 20px; color: var(--text-title);">⚙️ Painel de Administração</h2>
            
            <div class="admin-tabs">
                <div class="admin-tab active" onclick="switchAdminTab('menus')">Gestão de Menus</div>
                <div class="admin-tab" onclick="switchAdminTab('users')">Gestão de Usuários</div>
            </div>

            <!-- ABA DE MENUS -->
            <div id="tab-menus">
                <div class="header-actions">
                    <button class="btn btn-blue" onclick="salvarNoFirebase()">💾 Salvar na Nuvem</button>
                    <button class="btn btn-dark" onclick="baixarJSON()">⬇️ Baixar .json</button>
                    <input type="file" id="jsonUpload" accept=".json" style="display:none" onchange="subirJSON(event)">
                    <button class="btn btn-green" onclick="document.getElementById('jsonUpload').click()">⬆️ Subir .json</button>
                </div>
                <div id="categorias-container"></div>
                <button class="btn btn-green" onclick="adicionarCategoria()" style="width: 100%; margin-top: 10px; justify-content: center; padding: 12px; font-size: 1rem;">+ Adicionar Nova Categoria</button>
            </div>

            <!-- ABA DE USUÁRIOS -->
            <div id="tab-users" style="display:none;">
                <p style="color: var(--text-muted); margin-bottom: 15px;">Aprove acessos e altere cargos. As alterações são salvas diretamente na planilha.</p>
                <div style="overflow-x: auto;">
                    <table class="user-table">
                        <thead><tr><th>Usuário</th><th>E-mail</th><th>Status</th><th>Cargo</th><th>Ação</th></tr></thead>
                        <tbody id="users-tbody"><tr><td colspan="5" style="text-align:center;">Carregando usuários...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="acessoNegado" style="display:none; text-align:center; padding: 50px;"><h2 style="color: #FF5252;">Acesso Negado 🛑</h2><p>Faça login com cargo de 'admin'.</p></div>
    </div>

    <datalist id="lista-usuarios"></datalist>

    <script>
        const ICONES_LOGISTICA = ["📦", "🚚", "🚛", "✈️", "🚢", "🛒", "🏭", "🏗️", "📋", "📊", "📈", "📉", "🛠️", "⚙️", "🧑‍💻", "🔐", "📁", "📂", "🗄️", "📅", "📆", "⏱️", "⏲️", "💰", "💳", "🧾", "⚖️", "🛡️", "🔔", "📌", "📍", "🗺️", "🌐", "📱", "💻", "🖨️", "🏷️", "🏢", "👥", "🚨", "✅", "❌", "🔄", "🔍", "📝", "🚀", "🛑", "📹", "📤", "📥", "👷", "🚧", "🚒", "🚑", "↳"];
        let adMenuData = { categorias: [] }; let allUsers = [];

        window.onload = async () => {
            const userStr = localStorage.getItem('loggedUser'); if(!userStr) { document.getElementById('acessoNegado').style.display = 'block'; return; }
            const user = JSON.parse(userStr); if(user.cargo !== 'admin') { document.getElementById('acessoNegado').style.display = 'block'; return; }

            document.getElementById('adminPanel').style.display = 'block';
            try { const res = await fetch(`https://reportes-bdb0a-default-rtdb.firebaseio.com/menu_global.json`); const data = await res.json(); adMenuData = data && data.categorias ? data : { categorias: [] }; renderizarAdmin(); } catch (e) { console.error(e); }
            fetchUsersFromSheet();
        };

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-menus').style.display = tab === 'menus' ? 'block' : 'none';
            document.getElementById('tab-users').style.display = tab === 'users' ? 'block' : 'none';
            event.target.classList.add('active');
        }

        async function fetchUsersFromSheet() {
            try {
                const res = await fetch(APP_SCRIPT_URL, { method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow", body: JSON.stringify({ action: "getUsers" }) });
                const data = await res.json();
                if(data.success) { allUsers = data.users; renderUserTable(); populateDatalist(); }
            } catch(e) {}
        }
        function populateDatalist() { const dl = document.getElementById('lista-usuarios'); dl.innerHTML = ''; allUsers.forEach(u => { dl.innerHTML += `<option value="${u.usuario}">`; }); }
        function renderUserTable() {
            const tbody = document.getElementById('users-tbody'); tbody.innerHTML = '';
            allUsers.forEach((u, idx) => {
                tbody.innerHTML += `<tr><td><strong>${u.usuario}</strong></td><td>${u.email}</td>
                    <td><select id="status-${idx}"><option value="pendente" ${u.solicitacao === 'pendente' ? 'selected' : ''}>Pendente</option><option value="aprovado" ${u.solicitacao === 'aprovado' ? 'selected' : ''}>Aprovado</option><option value="bloqueado" ${u.solicitacao === 'bloqueado' ? 'selected' : ''}>Bloqueado</option></select></td>
                    <td><select id="cargo-${idx}"><option value="view" ${u.cargo === 'view' ? 'selected' : ''}>View</option><option value="editor" ${u.cargo === 'editor' ? 'selected' : ''}>Editor</option><option value="admin" ${u.cargo === 'admin' ? 'selected' : ''}>Admin</option></select></td>
                    <td><button class="btn btn-blue" onclick="salvarUsuario(${idx}, '${u.usuario}')">Atualizar</button></td></tr>`;
            });
        }
        async function salvarUsuario(idx, username) {
            const status = document.getElementById(`status-${idx}`).value; const cargo = document.getElementById(`cargo-${idx}`).value;
            try { const res = await fetch(APP_SCRIPT_URL, { method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow", body: JSON.stringify({ action: "updateUser", usuario: username, solicitacao: status, cargo: cargo }) }); const data = await res.json(); alert(data.message); } catch(e) { alert("Erro ao atualizar."); }
        }

        function getIconOptions(selected) { return ICONES_LOGISTICA.map(ico => `<option value="${ico}" ${ico === selected ? 'selected' : ''}>${ico}</option>`).join(''); }

        function renderizarAdmin() {
            const container = document.getElementById('categorias-container'); container.innerHTML = '';
            adMenuData.categorias.forEach((cat, catIdx) => {
                let itemsHtml = '';
                (cat.items || []).forEach((item, itemIdx) => {
                    let subItemsHtml = '';
                    (item.subItems || []).forEach((sub, subIdx) => {
                        subItemsHtml += `
                            <div class="sub-subitem-row">
                                <span style="color:var(--accent-blue);">↳ 3º Nível:</span>
                                <select onchange="updateSubItem(${catIdx}, ${itemIdx}, ${subIdx}, 'icon', this.value)" style="flex: 0 1 50px;">${getIconOptions(sub.icon)}</select>
                                <input type="text" placeholder="Nome" value="${sub.title || ''}" onchange="updateSubItem(${catIdx}, ${itemIdx}, ${subIdx}, 'title', this.value)">
                                <input type="text" placeholder="URL (.html)" value="${sub.url || ''}" onchange="updateSubItem(${catIdx}, ${itemIdx}, ${subIdx}, 'url', this.value)">
                                <input type="text" placeholder="Ver (view,editor)" value="${sub.viewRoles || 'view,editor,admin'}" onchange="updateSubItem(${catIdx}, ${itemIdx}, ${subIdx}, 'viewRoles', this.value)">
                                <input type="text" placeholder="Editar (editor,admin)" value="${sub.uploadRoles || 'editor,admin'}" onchange="updateSubItem(${catIdx}, ${itemIdx}, ${subIdx}, 'uploadRoles', this.value)">
                                <input type="text" list="lista-usuarios" placeholder="Usuários p/ Editar" value="${sub.allowedUsers || ''}" onchange="updateSubItem(${catIdx}, ${itemIdx}, ${subIdx}, 'allowedUsers', this.value)">
                                <button class="btn btn-red" onclick="removerSubItem(${catIdx}, ${itemIdx}, ${subIdx})">✖</button>
                            </div>`;
                    });

                    itemsHtml += `
                        <div class="subitem-row">
                            <span style="color:#888; font-weight:bold;">2º Nível</span>
                            <select onchange="updateItem(${catIdx}, ${itemIdx}, 'icon', this.value)" style="flex: 0 1 50px;">${getIconOptions(item.icon)}</select>
                            <input type="text" placeholder="Nome do Menu" value="${item.title || ''}" onchange="updateItem(${catIdx}, ${itemIdx}, 'title', this.value)">
                            <input type="text" placeholder="URL da Página" value="${item.url || ''}" onchange="updateItem(${catIdx}, ${itemIdx}, 'url', this.value)">
                            <div style="flex-basis: 100%; height: 0; margin: 0;"></div>
                            <input type="text" placeholder="Ver (view,editor,admin)" title="Cargos Visuais" value="${item.viewRoles || 'view,editor,admin'}" onchange="updateItem(${catIdx}, ${itemIdx}, 'viewRoles', this.value)">
                            <input type="text" placeholder="Editar (editor,admin)" title="Cargos Edição" value="${item.uploadRoles || 'editor,admin'}" onchange="updateItem(${catIdx}, ${itemIdx}, 'uploadRoles', this.value)">
                            <input type="text" list="lista-usuarios" placeholder="Usuários p/ Editar (João, Maria)" title="Permissão direta por nome" value="${item.allowedUsers || ''}" onchange="updateItem(${catIdx}, ${itemIdx}, 'allowedUsers', this.value)">
                            <button class="btn btn-dark" onclick="adicionarSubItem(${catIdx}, ${itemIdx})">+ Sub-submenu (3º Nível)</button>
                            <button class="btn btn-red" onclick="removerItem(${catIdx}, ${itemIdx})">✖ Remover</button>
                            <div style="width: 100%;">${subItemsHtml}</div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="cat-card">
                        <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center; flex-wrap:wrap; border-bottom: 2px solid var(--border-card); padding-bottom: 15px;">
                            <span style="font-weight:900; color:var(--text-title); font-size:1.1rem;">1º Nível (Categoria):</span>
                            <select onchange="updateCat(${catIdx}, 'icon', this.value)" style="padding:8px; border-radius:4px; border: 1px solid var(--border-card); background: var(--bg-body); color: var(--text-main);">${getIconOptions(cat.icon)}</select>
                            <input type="text" placeholder="Nome" value="${cat.category || ''}" onchange="updateCat(${catIdx}, 'category', this.value)" style="flex:1; min-width: 150px; padding:8px; font-weight:bold; border-radius:4px; border: 1px solid var(--border-card); background: var(--bg-body); color: var(--text-main);">
                            <input type="text" placeholder="Ver (view,editor,admin)" value="${cat.viewRoles || 'view,editor,admin'}" onchange="updateCat(${catIdx}, 'viewRoles', this.value)" style="padding:8px; border-radius:4px; border: 1px solid var(--border-card); background: var(--bg-body); color: var(--text-main);">
                            <button class="btn btn-red" onclick="removerCategoria(${catIdx})">Excluir Categoria</button>
                        </div>
                        ${itemsHtml}
                        <button class="btn btn-blue" style="margin-top:10px;" onclick="adicionarItem(${catIdx})">+ Adicionar Menu (2º Nível)</button>
                    </div>
                `;
            });
        }

        function baixarJSON() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(adMenuData, null, 2)); const d = document.createElement('a'); d.href = dataStr; d.download = "menu_global.json"; document.body.appendChild(d); d.click(); d.remove(); }
        function subirJSON(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { const parsed = JSON.parse(e.target.result); if(parsed.categorias) { adMenuData = parsed; renderizarAdmin(); alert("JSON carregado!"); } else alert("Estrutura inválida."); } catch (err) { alert("Erro ao ler JSON."); } }; reader.readAsText(file); }

        function adicionarCategoria() { adMenuData.categorias.push({ category: "Nova Categoria", icon: "📦", viewRoles: "view,editor,admin", items: [] }); renderizarAdmin(); }
        function removerCategoria(idx) { adMenuData.categorias.splice(idx, 1); renderizarAdmin(); }
        function updateCat(idx, field, value) { adMenuData.categorias[idx][field] = value; }
        
        function adicionarItem(catIdx) { if(!adMenuData.categorias[catIdx].items) adMenuData.categorias[catIdx].items = []; adMenuData.categorias[catIdx].items.push({ icon: "📋", title: "Novo Link", url: "#", viewRoles: "view,editor,admin", uploadRoles: "editor,admin", allowedUsers: "", subItems: [] }); renderizarAdmin(); }
        function removerItem(catIdx, itemIdx) { adMenuData.categorias[catIdx].items.splice(itemIdx, 1); renderizarAdmin(); }
        function updateItem(catIdx, itemIdx, field, value) { adMenuData.categorias[catIdx].items[itemIdx][field] = value; }

        function adicionarSubItem(catIdx, itemIdx) { if(!adMenuData.categorias[catIdx].items[itemIdx].subItems) adMenuData.categorias[catIdx].items[itemIdx].subItems = []; adMenuData.categorias[catIdx].items[itemIdx].subItems.push({ icon: "↳", title: "Sub-link", url: "#", viewRoles: "view,editor,admin", uploadRoles: "editor,admin", allowedUsers: "" }); renderizarAdmin(); }
        function removerSubItem(catIdx, itemIdx, subIdx) { adMenuData.categorias[catIdx].items[itemIdx].subItems.splice(subIdx, 1); renderizarAdmin(); }
        function updateSubItem(catIdx, itemIdx, subIdx, field, value) { adMenuData.categorias[catIdx].items[itemIdx].subItems[subIdx][field] = value; }

        async function salvarNoFirebase() { try { await fetch(`https://reportes-bdb0a-default-rtdb.firebaseio.com/menu_global.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(adMenuData) }); alert("Salvo com sucesso!"); } catch(e) { alert("Erro ao salvar."); } }
    </script>
</body>
</html>
