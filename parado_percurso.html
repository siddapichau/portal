<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parado no Percurso - Mercado Livre</title>
    
    <!-- SISTEMA ANTI-ACESSO DIRETO -->

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Variáveis Específicas do Painel */
        :root {
            --bg-input: rgba(15, 23, 42, 0.6);
            --border-input: rgba(255, 255, 255, 0.2);
        }
        [data-theme="light"] {
            --bg-input: rgba(255, 255, 255, 0.7);
            --border-input: rgba(0, 0, 0, 0.15);
        }

        body { 
            padding: 10px; display: flex; flex-direction: column; gap: 10px; 
            height: 100vh; overflow: hidden; background: transparent !important;
        }

        .glass-panel { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-card); border-radius: 10px; box-shadow: var(--shadow-card); transition: 0.3s; }

        .top-header { background-color: #FFF159 !important; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); flex: 0 0 auto; }
        .ml-logo { height: 22px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15)); flex-shrink: 0; }
        .header-center { flex: 1 1 auto; text-align: center; font-size: 0.85rem; font-weight: 900; color: #2D3277 !important; letter-spacing: 0.5px; text-transform: uppercase; margin: 0 10px; line-height: 1.2; }
        .header-right { display: flex; align-items: center; gap: 4px; justify-content: flex-end; flex-wrap: wrap; flex-shrink: 0; }
        
        .status-badge { font-size: .65rem; font-weight: 800; color: #333 !important; background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 4px; white-space: nowrap; }

        .btn { background: #ffffff; color: #333333; border: 1px solid rgba(0,0,0,0.1); border-radius: 4px; padding: 4px 8px; font-size: .65rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; transition: all .2s ease; text-decoration: none; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .btn svg { width: 12px; height: 12px; }
        .btn:hover:not(:disabled) { background: #f1f1f1; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-blue { background: var(--accent-blue) !important; color: #fff !important; border-color: var(--accent-blue) !important; }
        .btn-blue:hover:not(:disabled) { background: #226fe6 !important; }
        .btn-compare { background: #6366f1 !important; color: #fff !important; border-color: #6366f1 !important; }
        .btn-compare:hover:not(:disabled) { background: #4f46e5 !important; }
        .btn-camera { background: var(--accent-green) !important; color: #fff !important; border-color: var(--accent-green) !important; }
        
        .upload-wrapper { position: relative; overflow: hidden; display: inline-flex; }
        .upload-wrapper input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 100px; }

        #export-container { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
        .filters-container { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; }
        .compare-row { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; background: rgba(99, 102, 241, 0.08); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 6px; }
        .compare-row.active { display: grid; }
        .field label { display: block; color: var(--text-muted); font-size: .70rem; font-weight: 800; margin-bottom: 4px; text-transform: uppercase; }
        .field select, .field input { width: 100%; background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-input); border-radius: 6px; padding: 6px 10px; outline: none; font-family: 'Inter', sans-serif; font-size: .80rem; font-weight: 600;}
        .field select:focus, .field input:focus { border-color: var(--accent-blue); }
        .field select option { background: #1e293b; color: #fff; } 
        [data-theme="light"] .field select option { background: #fff; color: #000; }

        .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 0 0 auto; }
        .summary-card { padding: 12px; border-left: 6px solid var(--accent-blue); display: flex; flex-direction: column; justify-content: center; text-align: center; min-height: 0;}
        .summary-card.red { border-left-color: var(--accent-red); }
        .summary-card.green { border-left-color: var(--accent-green); }
        .summary-card.warn { border-left-color: var(--accent-warn); }
        .summary-title { color: var(--text-muted); font-size: .75rem; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        .summary-value { color: var(--text-title); font-size: 1.8rem; font-weight: 900; }

        .table-wrapper { flex: 1 1 35vh; min-height: 120px; overflow: auto; border-radius: 10px; transform: translateZ(0); }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; text-align: left; }
        th, td { padding: 8px 12px; border-bottom: 1px solid var(--border-card); font-size: .85rem; vertical-align: middle; color: var(--text-main); }
        th { background: rgba(0,0,0,0.6); color: var(--text-title); text-transform: uppercase; font-size: .75rem; font-weight: 900; position: sticky; top: 0; z-index: 2; backdrop-filter: blur(10px); }
        [data-theme="light"] th { background: rgba(255,255,255,0.9); }
        tr.clickable-row { cursor: pointer; transition: background 0.2s; }
        tr.clickable-row:hover td { background: rgba(255,255,255,0.08) !important; }
        [data-theme="light"] tr.clickable-row:hover td { background: rgba(0,0,0,0.04) !important; }

        .center { text-align: center; }
        .col-id { font-weight: 900; color: var(--text-title); display: flex; align-items: center; gap: 8px;}
        .col-val { font-weight: 900; color: var(--accent-green); }
        .col-dias { font-weight: 900; font-size: 0.95rem; }
        
        .action-icon { transition: transform 0.2s; display: inline-flex; cursor: pointer; padding: 4px; border-radius: 4px; }
        .action-icon:hover { transform: scale(1.15); }
        .lupa-icon { color: var(--accent-blue); background: rgba(52, 131, 250, 0.1); border: 1px solid rgba(52, 131, 250, 0.2); }
        .planilha-icon { color: var(--accent-warn); background: rgba(255, 176, 0, 0.1); border: 1px solid rgba(255, 176, 0, 0.2); }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.70rem; font-weight: 900; color: #fff; text-transform: uppercase; white-space: nowrap; display: inline-block; text-align: center; letter-spacing: 0.5px;}
        .badge-resolvido { background-color: var(--accent-green, #00A650); }
        .badge-novo { background-color: var(--accent-warn, #FFB000); color: #333; }
        .badge-critico { background-color: var(--accent-red, #FF5252); }
        .badge-sim { background-color: var(--accent-red, #FF5252); }
        .badge-nao { background-color: var(--text-muted, #94a3b8); color: #fff; }

        .chart-container { flex: 0 0 28vh; min-height: 200px; padding: 10px; width: 100%; display: flex; flex-direction: column; }
        .chart-title { flex: 0 0 auto; font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .chart-wrapper { position: relative; flex: 1; min-height: 0; height: 100%; width: 100%; display: flex; justify-content: center; align-items: center; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(6px); padding: 16px; }
        .custom-modal.active { display: flex; }
        .modal-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; color: var(--text-main); box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(20px);}
        .modal-header { padding: 15px 20px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-card); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); }
        .modal-title { font-size: 1.1rem; font-weight: 900; color: var(--text-title); text-transform: uppercase;}
        .modal-close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; display: inline-flex; line-height: 1; font-weight: bold;}
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 0.9rem; }
        .modal-grid-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-card); padding-bottom: 8px; }
        .modal-label { font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; width: 40%;}
        .modal-val-text { font-weight: 600; word-break: break-word; text-align: right; width: 60%;}

        /* Ocultar elementos ao exportar para 4K */
        .exporting .header-right, .exporting #sessao-filtros { display: none !important; }
        .exporting .table-wrapper { overflow: hidden !important; max-height: none !important; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 3px; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>
<body data-theme="light">

    <div class="top-header">
        <img src="https://upload.wikimedia.org/wikipedia/pt/0/04/Logotipo_MercadoLivre.png" class="ml-logo" alt="Mercado Livre">
        <div class="header-center" id="main-title">Parado no Percurso (SSC1)</div>
        <div class="header-right" id="botoes-topo">
            <span class="status-badge" id="data-status">Conectando...</span>
            <button class="btn btn-compare" onclick="toggleCompareMode()" id="btn-toggle-compare">⚖️ Comparar</button>
            <button class="btn btn-camera" onclick="baixarImagemSnapshot()" id="btn-print">📸 Foto 4K</button>
            <button class="btn-csv" onclick="exportarCSV()" title="Baixar os dados exibidos em CSV (abre no Excel)">⬇️ CSV</button>
            
            <button class="btn btn-blue" onclick="prepararEmailModal()" id="btn-email">✉️ E-mail</button>
            
            <div class="upload-wrapper" id="upload-dados-wrapper" title="Subir CSV Principal (Pacotes)" style="display:none;">
                <button class="btn btn-blue">📤 Dados</button>
                <input type="file" id="csvFileInput" accept=".csv">
            </div>

            <div class="upload-wrapper" id="upload-emails-wrapper" title="Subir CSV de Contatos / E-mails LP" style="display:none;">
                <button class="btn">👥 E-mails</button>
                <input type="file" id="csvEmailsInput" accept=".csv">
            </div>
        </div>
    </div>

    <div id="export-container">
        
        <div class="filters-container glass-panel" id="sessao-filtros">
            <div class="compare-row" id="compare-row">
                <div class="field"><label style="color: #6366f1;">Data Referência (A - Passado)</label><select id="filter-data-A" onchange="processarComparacao()"></select></div>
                <div class="field"><label style="color: var(--accent-red);">Data Atual (B - Presente)</label><select id="filter-data-B" onchange="processarComparacao()"></select></div>
            </div>

            <div class="filters-grid">
                <div class="field" id="box-data-unica"><label>Data Histórico</label><select id="filter-data-historico" onchange="carregarDadosDaDataSelecionada()"></select></div>
                <div class="field"><label>Origem</label><select id="filter-origem" onchange="aplicarFiltros()"><option value="Todos">Todos</option></select></div>
                <div class="field"><label>Valor do Pacote</label><select id="filter-valor" onchange="aplicarFiltros()"><option value="Todos">Todos</option><option value="Maior500">De R$ 500,00 para cima</option><option value="Menor500">Abaixo de R$ 500,00</option></select></div>
                <div class="field"><label>Reclamação (CX)</label><select id="filter-reclamacao" onchange="aplicarFiltros()"><option value="Todos">Todos</option><option value="SIM">Sim</option><option value="NÃO">Não</option></select></div>
                <div class="field" style="grid-column: span 1;"><label>Buscar (ID, Descrição)</label><input type="text" id="search-input" placeholder="Digite para filtrar..." oninput="aplicarFiltros()"></div>
            </div>
        </div>

        <div class="summary" id="sessao-kpis">
            <div class="summary-card glass-panel" id="kpi-box-1"><div class="summary-title" id="kpi-title-1">Total Pacotes</div><div class="summary-value" id="kpi-val-1">0</div></div>
            <div class="summary-card warn glass-panel" id="kpi-box-2"><div class="summary-title" id="kpi-title-2">Valor Retido (R$)</div><div class="summary-value" id="kpi-val-2">R$ 0,00</div></div>
            <div class="summary-card red glass-panel" id="kpi-box-3"><div class="summary-title" id="kpi-title-3">Média de Dias Estancados</div><div class="summary-value" id="kpi-val-3">0</div></div>
            <div class="summary-card green glass-panel" id="kpi-box-4"><div class="summary-title" id="kpi-title-4">Com Reclamação</div><div class="summary-value" id="kpi-val-4">0</div></div>
        </div>

        <div class="table-wrapper glass-panel" id="tabela-conteiner" onscroll="carregarMaisPacotes()">
            <table>
                <thead>
                    <tr id="table-head">
                        <th style="width:15%;">ID do Pacote</th><th style="width:10%;">Origem</th><th style="width:35%;">Descrição</th><th style="width:13%;">Valor</th><th class="center" style="width:8%;">Dias Parado</th><th class="center" style="width:9%;">Reclamação</th><th style="width:10%;">Observação</th>
                    </tr>
                </thead>
                <tbody id="tbody-dados"><tr><td class="center" colspan="7" style="padding: 30px;">Aguardando dados...</td></tr></tbody>
            </table>
        </div>

        <div class="chart-container glass-panel" id="grafico-conteiner">
            <div class="chart-title">Análise por HUB de Origem</div>
            <div class="chart-wrapper"><canvas id="origensChart"></canvas></div>
        </div>
    </div>

    <div class="custom-modal" id="info-modal" onclick="fecharModalExterno(event)">
        <div class="modal-card" onclick="event.stopPropagation();">
            <div class="modal-header"><div class="modal-title" id="modal-header-title">Detalhes</div><button class="modal-close-btn" onclick="fecharModal()">&times;</button></div>
            <div class="modal-body" id="modal-header-body"></div>
        </div>
    </div>

    <script>
        Chart.register(ChartDataLabels);

        const FIREBASE_URL_BASE = "https://reportes-bdb0a-default-rtdb.firebaseio.com/";
        const FIREBASE_NODE = "parado_percurso";
        const FIREBASE_NODE_EMAILS = "parado_percurso_emails"; 
        
        let HISTORICO_COMPLETO = {}; let ITEMS_ATUAIS = []; let ITEMS_COMPARE = []; let IS_COMPARE_MODE = false;
        let chartInstance = null; let DB_EMAILS = {}; 
        let PAGE_SIZE = 50; let CUR_PAGE = 0; let DADOS_FILTRADOS = [];

        // ============ SINCRONIZAÇÃO DE TEMA (Pai p/ Filho) ============
        function syncTheme() { const theme = localStorage.getItem('themePreference') || 'light'; document.body.setAttribute('data-theme', theme); }
        syncTheme();
        window.addEventListener('message', (event) => { 
            if (event.data.type === 'THEME_CHANGED') { 
                document.body.setAttribute('data-theme', event.data.theme); 
                Chart.defaults.color = getChartTextColor();
                if(DADOS_FILTRADOS.length > 0) renderGrafico(DADOS_FILTRADOS);
            } 
        });

        // ============ PERMISSÕES GLOBAIS E LOGS ============
        const currentUser = JSON.parse(localStorage.getItem('loggedUser')) || null;
        let userName = currentUser && currentUser.usuario ? currentUser.usuario : 'Sistema';
        const paginaNome = window.location.pathname.split('/').pop() || 'parado_percurso.html';
        let canEdit = window.parent && typeof window.parent.verificarPermissaoUpload === 'function' ? window.parent.verificarPermissaoUpload(paginaNome) : false;
        
        if(canEdit) { 
            document.getElementById('upload-dados-wrapper').style.display = 'inline-flex'; 
            document.getElementById('upload-emails-wrapper').style.display = 'inline-flex'; 
        }

        async function registrarLogFirebase(modulo, acao) {
            try {
                const logData = { modulo: modulo, acao: acao, usuario: userName, timestamp: Date.now() };
                await fetch(`${FIREBASE_URL_BASE}logs.json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(logData) });
            } catch(e) {}
        }

        function setStatus(texto, cor = "#333") { const el = document.getElementById('data-status'); if (el) { el.innerText = texto; el.style.color = cor; } }

        function formatarDataChave(dateObj) { return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`; }
        function formatarDataBr(chaveStr) { if (!chaveStr || !chaveStr.includes('-')) return chaveStr; const [ano, mes, dia] = chaveStr.split('-'); return `${dia}/${mes}/${ano}`; }
        function parseCurrency(valStr) { if (!valStr) return 0; let s = String(valStr).replace('R$', '').replace(/\./g, '').replace(',', '.').trim(); return parseFloat(s) || 0; }
        function formatCurrency(valNum) { return valNum.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function escapeHtml(value) { return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;'); }
        function normalizeText(value) { return String(value ?? '').trim(); }

        // ==========================================
        // GERAÇÃO DE E-MAILS (INTACTA)
        // ==========================================
        async function carregarEmailsDoFirebase() {
            try { const response = await fetch(`${FIREBASE_URL_BASE}${FIREBASE_NODE_EMAILS}.json`); if (response.ok) { const data = await response.json(); if (data) { DB_EMAILS = data; } } } catch (err) {}
        }

        async function salvarEmailsNoFirebase(emailsObj) {
            try { await fetch(`${FIREBASE_URL_BASE}${FIREBASE_NODE_EMAILS}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(emailsObj) }); } catch (err) {}
        }

        document.getElementById('csvEmailsInput').addEventListener('change', function(e) {
            if(!canEdit) return;
            const file = e.target.files[0]; if (!file) return;
            setStatus('Lendo E-mails...', '#3483FA');
            Papa.parse(file, { header: true, skipEmptyLines: true, complete: async function(results) {
                let count = 0; const emailRegex = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/gi;
                results.data.forEach(row => {
                    const keys = Object.keys(row); const kOrigem = keys.find(k => k.trim().toLowerCase() === 'service' || k.trim().toLowerCase() === 'origem');
                    if (kOrigem && row[kOrigem]) {
                        let origem = row[kOrigem].trim(); const primeiraLetra = origem.charAt(0).toUpperCase();
                        if (primeiraLetra === 'S' || primeiraLetra === 'X') { origem = 'BR' + origem; }
                        let emailsEncontrados = []; keys.forEach(k => { const val = String(row[k] || '').trim(); let match; while ((match = emailRegex.exec(val)) !== null) { emailsEncontrados.push(match[1]); } });
                        const emailsFixos = [ "uilliam.sena@mercadolivre.com", "walbert.vieira@mercadolivre.com", "guilherme.aalmeida@mercadolivre.com", "israel.fsilva@mercadolivre.com", "ext_sancpere@mercadolivre.com", "danilo.sanchezpereira@dhl.com", "alex.asilva@mercadolivre.com", "ext_heyago@mercadolivre.com", "gabriela.dasilva@mercadolivre.com" ];
                        emailsEncontrados.push(...emailsFixos);
                        if (emailsEncontrados.length > 0) { DB_EMAILS[origem] = [...new Set(emailsEncontrados)].join(', '); count++; }
                    }
                });
                setStatus(`Salvando contatos no banco...`, '#FFB000');
                await salvarEmailsNoFirebase(DB_EMAILS);
                await registrarLogFirebase("Parado Percurso", "Subiu uma nova planilha de Contatos / E-mails de Origens.");
                setStatus(`${count} origens atualizadas com e-mails!`, '#00A650'); setTimeout(() => setStatus('Pronto', '#333'), 4000);
            }});
        });

        async function prepararEmailModal() {
            const origemFiltro = document.getElementById('filter-origem').value;
            if (origemFiltro === 'Todos') { alert("⚠️ Selecione uma Origem específica no filtro antes de gerar o E-mail."); return; }

            const btn = document.getElementById('btn-email'); const textoOriginal = btn.innerText; btn.innerText = "⏳ Preparando..."; btn.disabled = true;

            const valFilterEl = document.getElementById('filter-valor'); const originalFilterValue = valFilterEl.value; valFilterEl.value = 'Menor500';
            const container = document.getElementById('export-container'); document.body.classList.add('exporting'); aplicarFiltros(); 
            await new Promise(r => setTimeout(r, 600));

            let imgData = "";
            try {
                const bgCor = document.body.getAttribute('data-theme') === 'light' ? '#f1f5f9' : '#0b121f';
                const canvas = await html2canvas(container, { scale: 1.5, useCORS: true, allowTaint: true, backgroundColor: bgCor, windowWidth: document.documentElement.offsetWidth });
                imgData = canvas.toDataURL('image/png', 1.0);
            } catch (err) { console.error(err); alert("Erro ao capturar a imagem do dashboard."); } 
            finally { document.body.classList.remove('exporting'); btn.innerText = textoOriginal; btn.disabled = false; valFilterEl.value = originalFilterValue; aplicarFiltros(); }

            let saudacao = "Bom dia"; const hora = new Date().getHours(); if (hora >= 12 && hora < 18) saudacao = "Boa tarde"; else if (hora >= 18) saudacao = "Boa noite";
            const itensDestaque = ITEMS_ATUAIS.filter(i => { return i.Origem === origemFiltro && i.DiasEstancados > 7 && parseCurrency(i.Valor) < 500; }).sort((a,b) => parseCurrency(b.Valor) - parseCurrency(a.Valor)); 
            let linhasHtml = '';

        async function carregarDoFirebase() {

        async function salvarNoFirebase(items) {
            const hoje = new Date(); const chaveData = formatarDataChave(hoje);

            try { 
                await fetch(`${FIREBASE_URL_BASE}${FIREBASE_NODE}/${chaveData}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); 
                await registrarLogFirebase("Parado Percurso", `Atualizou a base de pacotes estancados (${items.length} itens).`);
                HISTORICO_COMPLETO[chaveData] = payload; atualizarDropdownsDeDatas(); document.getElementById('filter-data-historico').value = chaveData; carregarDadosDaDataSelecionada(); 
            } catch (err) { alert("Erro ao gravar."); }

        function processarComparacao() {
            if (!IS_COMPARE_MODE) return;
            const chaveA = document.getElementById('filter-data-A').value; const chaveB = document.getElementById('filter-data-B').value;
            const listaA = (HISTORICO_COMPLETO[chaveA] && HISTORICO_COMPLETO[chaveA].lista) ? HISTORICO_COMPLETO[chaveA].lista : []; const listaB = (HISTORICO_COMPLETO[chaveB] && HISTORICO_COMPLETO[chaveB].lista) ? HISTORICO_COMPLETO[chaveB].lista : [];
            let mapA = {}; listaA.forEach(i => mapA[i.ID] = i); let mapB = {}; listaB.forEach(i => mapB[i.ID] = i);
            let todosIDs = new Set([...Object.keys(mapA), ...Object.keys(mapB)]);
            ITEMS_COMPARE = []; let countResolvidos = 0; let countNovos = 0; let countCriticos = 0;
            
            todosIDs.forEach(id => {

                ITEMS_COMPARE.push({ ID: id, Origem: infoBase.Origem, Descricao: infoBase.Descricao, Valor: infoBase.Valor, DiasEstancados: infoBase.DiasEstancados, DiasA: itemA ? itemA.DiasEstancados : '-', DiasB: itemB ? itemB.DiasEstancados : '-', Flag: flag, StatsText: stats, Reclamacao: infoBase.Reclamacao });

        function renderTabelaComparacao() {

                const valNum = parseCurrency(item.Valor); let matchValor = true; if (valorFiltro === 'Maior500') matchValor = valNum >= 500; if (valorFiltro === 'Menor500') matchValor = valNum < 500;

        function getChartTextColor() { return document.body.getAttribute('data-theme') === 'light' ? '#334155' : '#EBEBEB'; }
        function getGridColor() { return document.body.getAttribute('data-theme') === 'light' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)'; }

        function renderGrafico(filtrados) {
            const ctx = document.getElementById('origensChart').getContext('2d'); const stats = {};
            filtrados.forEach(item => { if(!stats[item.Origem]) { stats[item.Origem] = { count: 0, dias: 0, valor: 0 }; } stats[item.Origem].count += 1; stats[item.Origem].dias += item.DiasEstancados; stats[item.Origem].valor += parseCurrency(item.Valor); });
            const sortedOrigens = Object.keys(stats).sort((a,b) => stats[b].count - stats[a].count); const labels = sortedOrigens; const dataVolume = sortedOrigens.map(k => stats[k].count); const dataDias = sortedOrigens.map(k => Math.round(stats[k].dias / stats[k].count));
            if (chartInstance) chartInstance.destroy();
            Chart.defaults.color = getChartTextColor(); Chart.defaults.font.family = "'Inter', sans-serif";

            chartInstance = new Chart(ctx, {
                type: 'bar', data: { labels: labels, datasets: [ { type: 'bar', label: 'Volume', data: dataVolume, backgroundColor: '#3483FA', borderRadius: 4, maxBarThickness: 50, yAxisID: 'y' }, { type: 'line', label: 'Média de Dias', data: dataDias, borderColor: '#FF5252', backgroundColor: '#FF5252', borderWidth: 3, tension: 0.3, pointRadius: 5, pointHoverRadius: 8, yAxisID: 'y1' } ] },
                options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, animation: { enabled: false }, layout: { padding: { top: 30, bottom: 10 } }, onClick: (e, activeElements) => { if (activeElements && activeElements.length > 0) { const index = activeElements[0].index; mostrarPopupChart(chartInstance.data.labels[index]); } }, scales: { x: { grid: { display: false }, ticks: { font: {weight: 'bold'}, color: getChartTextColor() } }, y: { position: 'left', grid: { color: getGridColor() }, ticks: { color: getChartTextColor(), precision: 0 } }, y1: { position: 'right', grid: { display: false }, ticks: { color: getChartTextColor(), precision: 0 } } }, plugins: { legend: { position: 'top', labels: { font: { weight: 'bold'}, color: getChartTextColor() } }, datalabels: { color: function(context) { return context.dataset.type === 'bar' ? '#FFFFFF' : '#FF5252'; }, font: { weight: '900', size: 10 }, align: function(context) { return context.dataset.type === 'bar' ? 'center' : 'top'; }, anchor: function(context) { return context.dataset.type === 'bar' ? 'center' : 'center'; }, offset: function(context) { return context.dataset.type === 'bar' ? 0 : 8; }, formatter: function(value) { return value === 0 ? '' : value; } } } }
            });
        }

        // ==========================================
        // FOTO 4K
        // ==========================================
        function baixarImagemSnapshot() {
            const btn = document.getElementById('btn-print'); btn.innerHTML = "⏳"; btn.disabled = true;
            const valFilterEl = document.getElementById('filter-valor'); const originalFilterValue = valFilterEl.value; valFilterEl.value = 'Menor500'; aplicarFiltros();
            document.body.classList.add('exporting');
            setTimeout(() => {
                const bodyH = document.body.scrollHeight; const bodyW = document.body.clientWidth; 
                html2canvas(document.body, { scale: 3, useCORS: true, width: bodyW, windowWidth: bodyW, windowHeight: bodyH, backgroundColor: document.body.getAttribute('data-theme') === 'light' ? '#f1f5f9' : '#0b121f' }).then(canvas => {
                    document.body.classList.remove('exporting'); btn.innerHTML = "📸"; btn.disabled = false; valFilterEl.value = originalFilterValue; aplicarFiltros();
                    let link = document.createElement('a'); let dtSelect = document.getElementById('filter-data-historico'); let dt = dtSelect.options.length > 0 && dtSelect.selectedIndex >= 0 ? dtSelect.options[dtSelect.selectedIndex].text.replace(/\//g, '-') : 'Geral';
                    link.download = `Snapshot_Parado_Percurso_${dt}.png`; link.href = canvas.toDataURL('image/png'); link.click();
                });
            }, 600); 
        }

        // ==========================================
        // DETALHES DO PACOTE (clique na linha da tabela)
        // ------------------------------------------
        // CORREÇÃO: as linhas da tabela já chamavam mostrarDetalhesPacote(),
        // mas a função nunca existiu. Clicar em qualquer linha só gerava
        // "ReferenceError" no console e nada abria. Implementada aqui
        // reaproveitando o modal que a própria página já usa.
        // ==========================================
        function linhaDetalhe(rotulo, valor, estilo) {
            if (valor === undefined || valor === null || valor === '') valor = '-';
            return `<div class="modal-grid-row"><span class="modal-label">${escapeHtml(rotulo)}</span><span class="modal-val-text" style="${estilo || ''}">${escapeHtml(String(valor))}</span></div>`;
        }

        function mostrarDetalhesPacote(id, modo) {
            const lista = modo === 'comparacao' ? ITEMS_COMPARE : ITEMS_ATUAIS;
            const item = (lista || []).find(i => String(i.ID) === String(id));

            if (!item) {
                abrirModal('Detalhes do Pacote', '<div style="padding:20px; text-align:center; color:var(--accent-red); font-weight:700;">Não foi possível localizar os dados deste pacote.</div>');
                return;
            }

            const linkRastreio = `https://envios.adminml.com/logistics/package-management/package/${encodeURIComponent(item.ID)}`;
            const linkSauron = `https://shipping-bo.adminml.com/sauron/shipments/shipment/${encodeURIComponent(item.ID)}`;

            let html = '';
            html += linhaDetalhe('ID', item.ID, 'color:var(--accent-blue); font-weight:900;');
            html += linhaDetalhe('Origem', item.Origem);
            html += linhaDetalhe('Descrição', item.Descricao);
            html += linhaDetalhe('Valor', item.Valor, 'color:var(--accent-green); font-weight:900;');

            if (modo === 'comparacao') {
                html += linhaDetalhe('Dias (Base A)', item.DiasA);
                html += linhaDetalhe('Dias (Base B)', item.DiasB);
                html += linhaDetalhe('Status Comparativo', item.StatsText);
                html += linhaDetalhe('Reclamação', item.Reclamacao);
            } else {
                html += linhaDetalhe('Dias Estancados', item.DiasEstancados, item.DiasEstancados > 10 ? 'color:var(--accent-red); font-weight:900;' : '');
                html += linhaDetalhe('Reclamação', item.Reclamacao);
                html += linhaDetalhe('Status', item.Status);
                html += linhaDetalhe('Observação', item.Observacao);
            }

            html += `<div class="modal-grid-row" style="border-bottom:none; gap:10px; flex-wrap:wrap; justify-content:flex-start; padding-top:12px;">
                        <a href="${linkRastreio}" target="_blank" rel="noopener" class="btn" style="text-decoration:none;">🔍 Rastrear Pacote</a>
                        <a href="${linkSauron}" target="_blank" rel="noopener" class="btn" style="text-decoration:none;">📋 Abrir no Sauron</a>
                     </div>`;

            abrirModal(`Pacote ${item.ID}`, html);
        }

        function abrirModal(titulo, htmlConteudo) { document.getElementById('modal-header-title').innerText = titulo; document.getElementById('modal-header-body').innerHTML = htmlConteudo; document.getElementById('info-modal').classList.add('active'); }
        function fecharModal() { document.getElementById('info-modal').classList.remove('active'); }
        function fecharModalExterno(e) { if (e.target.id === 'info-modal') fecharModal(); }

        carregarEmailsDoFirebase();
        carregarDoFirebase();
    
        // ==========================================
        // EXPORTAÇÃO CSV (usa js/export-csv.js)
        // Exporta a visão atual: comparação ou lista normal.
        // ==========================================
        function exportarCSV() {
            var dados = (typeof DADOS_FILTRADOS !== 'undefined' && DADOS_FILTRADOS && DADOS_FILTRADOS.length)
                ? DADOS_FILTRADOS
                : (typeof ITEMS_ATUAIS !== 'undefined' ? ITEMS_ATUAIS : []);
            var nome = (typeof IS_COMPARE_MODE !== 'undefined' && IS_COMPARE_MODE)
                ? 'parado_percurso_comparacao' : 'parado_percurso';
            var colunas = (typeof IS_COMPARE_MODE !== 'undefined' && IS_COMPARE_MODE)
                ? ['ID', 'Origem', 'Descricao', 'Valor', 'DiasA', 'DiasB', 'StatsText', 'Flag', 'Reclamacao']
                : ['ID', 'Origem', 'Descricao', 'Valor', 'DiasEstancados', 'Reclamacao', 'Status', 'Observacao'];
            PortalCSV.deObjetos(PortalCSV.nomeComData(nome), dados, colunas);
        }

        </script>
    <script src="js/export-csv.js"></script>
    <script src="js/mobile.js"></script>
</body>
